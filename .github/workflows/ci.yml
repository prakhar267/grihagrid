name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate D1 migrations on a fresh database
        run: npm run check:migrations

      - name: Build and run tests
        run: npm run check

      - name: Validate the Cloudflare Worker bundle
        run: npm run check:worker

      - name: Validate the isolated staging Worker bundle
        run: npm run check:worker:staging

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
