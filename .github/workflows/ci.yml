name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject pull request edits to existing migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          changed_existing="$(git diff --name-only --no-renames --diff-filter=DMRTUXB "$BASE_SHA" HEAD -- migrations)"
          if [ -n "$changed_existing" ]; then
            echo "applied migration files are immutable; add a new forward migration" >&2
            exit 1
          fi
          while IFS= read -r migration; do
            [ -n "$migration" ] || continue
            filename="${migration##*/}"
            [[ "$filename" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]
            if (( 10#${BASH_REMATCH[1]} <= 12 )); then
              echo "new migrations must follow the trusted 0012 baseline" >&2
              exit 1
            fi
          done < <(git diff --name-only --no-renames --diff-filter=A "$BASE_SHA" HEAD -- migrations)

      - name: Validate D1 migrations on a fresh database
        run: npm run check:migrations

      - name: Build and run tests
        run: npm run check

      - name: Validate the Cloudflare Worker bundle
        run: npm run check:worker

      - name: Validate the isolated staging Worker bundle
        run: npm run check:worker:staging

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Reject whitespace errors
        run: git diff --check
