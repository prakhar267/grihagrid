name: Public read-only smoke

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-read-only-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.environment }} liveness and fail-closed commerce
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            origin: https://grihagrid.prakhargupta267.workers.dev
          - environment: staging
            origin: https://grihagrid-staging.prakhargupta267.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check homepage, readiness, estimate, and catalog
        env:
          GRIHAGRID_SMOKE_ORIGIN: ${{ matrix.origin }}
          EXPECT_PAID_CHECKOUT: "false"
        run: node scripts/smoke.mjs
