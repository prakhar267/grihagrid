name: Deploy merged main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full merged main SHA to redeploy
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  security-events: read
  pull-requests: read

concurrency:
  group: deploy-merged-main
  queue: max

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.workflow_run.head_sha }}
  WRANGLER_VERSION: "4.122.0"
  BACKUP_KEY_VERSION: "2026-08-15-1"

jobs:
  authorize:
    name: Authorize exact merged main release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      pull_request: ${{ steps.gate.outputs.pull_request }}
      deploy: ${{ steps.scope.outputs.deploy }}
      migrations: ${{ steps.scope.outputs.migrations }}

    steps:
      - name: Check out the exact candidate with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Require a squash-merged PR and exact trusted workflow results
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh_api_read() {
            local destination="$1"
            shift
            local attempt
            local partial="${destination}.partial"
            rm -f -- "$partial"
            for attempt in 1 2 3 4; do
              if gh api "$@" > "$partial"; then
                mv -- "$partial" "$destination"
                return 0
              fi
              rm -f -- "$partial"
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 2))
              fi
            done
            echo "GitHub read failed after bounded retries" >&2
            return 1
          }
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "release SHA must be an ancestor of protected main" >&2
            exit 1
          }

          parent_count="$(git rev-list --parents -n 1 "$RELEASE_SHA" | awk '{ print NF - 1 }')"
          test "$parent_count" -eq 1 || {
            echo "release commit must be a single-parent squash merge" >&2
            exit 1
          }
          base_sha="$(git rev-parse "$RELEASE_SHA^")"

          gh_api_read "$RUNNER_TEMP/associated-pulls.json" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls"
          associated_pull_count="$(node --input-type=module - "$RUNNER_TEMP/associated-pulls.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const pulls = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(pulls) || pulls.some((pull) => Array.isArray(pull))) process.exit(1);
          process.stdout.write(String(pulls.length));
          NODE
          )"

          pull_evidence_file="$RUNNER_TEMP/associated-pulls.json"
          if [ "$associated_pull_count" -eq 0 ]; then
            gh_api_read "$RUNNER_TEMP/closed-main-pulls.json" \
              --paginate --slurp --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=closed -f base=main -f sort=updated -f direction=desc -F per_page=100
            pull_evidence_file="$RUNNER_TEMP/closed-main-pulls.json"
          fi

          pull_request="$(node --input-type=module - "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$pull_evidence_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const [sha, repository, filename] = process.argv.slice(2);
          const payload = JSON.parse(readFileSync(filename, "utf8"));
          if (!Array.isArray(payload)) process.exit(1);
          const pages = payload.every((item) => Array.isArray(item)) ? payload : [payload];
          if (pages.some((page) => !Array.isArray(page) || page.some((pull) => Array.isArray(pull)))) process.exit(1);
          const pulls = pages.flatMap((page) => page);
          const matches = pulls.filter((candidate) => (
            candidate.state === "closed"
            && candidate.merged_at
            && candidate.merge_commit_sha === sha
            && candidate.base?.ref === "main"
            && candidate.base?.repo?.full_name === repository
          ));
          if (matches.length !== 1) process.exit(1);
          const [pull] = matches;
          if (!Number.isSafeInteger(pull.number) || pull.number < 1) process.exit(1);
          process.stdout.write(String(pull.number));
          NODE
          )" || {
            echo "release SHA is not the squash result of a merged pull request into main" >&2
            exit 1
          }
          rm -f -- "$RUNNER_TEMP/associated-pulls.json" "$RUNNER_TEMP/closed-main-pulls.json"

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            gh_api_read "$RUNNER_TEMP/ci-run.json" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_CI_RUN_ID"
          else
            gh_api_read "$RUNNER_TEMP/ci-runs.json" \
              --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_SHA" -f branch=main -f event=push -f status=success -F per_page=100
            node --input-type=module - "$RELEASE_SHA" "$RUNNER_TEMP/ci-runs.json" "$RUNNER_TEMP/ci-run.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [sha, input, output] = process.argv.slice(2);
          const runs = JSON.parse(readFileSync(input, "utf8")).workflow_runs || [];
          const run = runs.find((candidate) => candidate.head_sha === sha && candidate.conclusion === "success");
          if (!run) process.exit(1);
          writeFileSync(output, JSON.stringify(run));
          NODE
          fi

          CI_SHA="$RELEASE_SHA" CI_REPOSITORY="$GITHUB_REPOSITORY" node --input-type=module - "$RUNNER_TEMP/ci-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const valid = run.path === ".github/workflows/ci.yml"
            && run.event === "push"
            && run.status === "completed"
            && run.conclusion === "success"
            && run.head_sha === process.env.CI_SHA
            && run.head_branch === "main"
            && run.head_repository?.full_name === process.env.CI_REPOSITORY;
          if (!valid) process.exit(1);
          NODE

          gh_api_read "$RUNNER_TEMP/workflows.json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows"
          codeql_workflow_id="$(node --input-type=module - "$RUNNER_TEMP/workflows.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const workflows = JSON.parse(readFileSync(process.argv[2], "utf8")).workflows || [];
          const workflow = workflows.find((candidate) => (
            candidate.path === "dynamic/github-code-scanning/codeql" && candidate.state === "active"
          ));
          if (!workflow) process.exit(1);
          process.stdout.write(String(workflow.id));
          NODE
          )"

          codeql_ready=false
          for attempt in $(seq 1 40); do
            gh_api_read "$RUNNER_TEMP/codeql-runs.json" \
              --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$codeql_workflow_id/runs" \
              -f head_sha="$RELEASE_SHA" -f branch=main -F per_page=100
            codeql_state="$(node --input-type=module - "$RELEASE_SHA" "$RUNNER_TEMP/codeql-runs.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const [sha, filename] = process.argv.slice(2);
          const payload = JSON.parse(readFileSync(filename, "utf8"));
          assert.ok(payload && typeof payload === "object" && !Array.isArray(payload), "CodeQL run response is invalid");
          assert.ok(Array.isArray(payload.workflow_runs), "CodeQL run collection is invalid");
          const exact = payload.workflow_runs.filter((run) => (
            run.path === "dynamic/github-code-scanning/codeql"
            && run.head_sha === sha
            && run.head_branch === "main"
          ));
          const runs = exact.map((run) => {
            assert.ok(run && typeof run === "object" && !Array.isArray(run), "CodeQL run entry is invalid");
            assert.ok(Number.isSafeInteger(run.id) && run.id > 0, "invalid exact-SHA CodeQL run ID");
            assert.ok(Number.isSafeInteger(run.run_number) && run.run_number > 0, "invalid exact-SHA CodeQL run number");
            assert.ok(Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0, "invalid exact-SHA CodeQL run attempt");
            assert.ok(typeof run.status === "string" && run.status.length > 0, "invalid exact-SHA CodeQL run status");
            assert.ok(Number.isFinite(Date.parse(String(run.created_at || ""))), "invalid exact-SHA CodeQL creation timestamp");
            assert.ok(Number.isFinite(Date.parse(String(run.run_started_at || ""))), "invalid exact-SHA CodeQL attempt start timestamp");
            assert.ok(Number.isFinite(Date.parse(String(run.updated_at || ""))), "invalid exact-SHA CodeQL update timestamp");
            if (run.status === "completed") {
              assert.ok(typeof run.conclusion === "string" && run.conclusion.length > 0, "completed CodeQL run lacks a conclusion");
            } else {
              assert.equal(run.conclusion, null, "active CodeQL run has a conclusion");
            }
            return run;
          });
          assert.equal(new Set(runs.map((run) => run.id)).size, runs.length, "duplicate exact-SHA CodeQL run ID");
          assert.equal(new Set(runs.map((run) => run.run_number)).size, runs.length, "duplicate exact-SHA CodeQL run number");
          const latestStartedAt = Math.max(...runs.map((run) => Date.parse(run.run_started_at)));
          const latest = runs.filter((run) => Date.parse(run.run_started_at) === latestStartedAt);
          if (runs.some((run) => run.status !== "completed")) {
            process.stdout.write("wait");
          } else if (latest.length > 0 && latest.every((run) => run.conclusion === "success")) {
            process.stdout.write("success");
          } else if (latest.length > 0) {
            process.stdout.write("failure");
          } else {
            process.stdout.write("wait");
          }
          NODE
            )"
            case "$codeql_state" in
              success)
                codeql_ready=true
                break
                ;;
              failure)
                echo "CodeQL failed on the exact release SHA" >&2
                exit 1
                ;;
              wait)
                sleep 15
                ;;
              *)
                echo "unexpected CodeQL state" >&2
                exit 1
                ;;
            esac
          done
          test "$codeql_ready" = true || {
            echo "timed out waiting for exact-SHA CodeQL" >&2
            exit 1
          }

          codeql_analysis_ready=false
          for attempt in $(seq 1 12); do
            gh_api_read "$RUNNER_TEMP/codeql-analyses.json" \
              --paginate --slurp --method GET \
              "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
              -f ref=refs/heads/main -f tool_name=CodeQL -F per_page=100
            if CODEQL_RELEASE_SHA="$RELEASE_SHA" node --input-type=module - "$RUNNER_TEMP/codeql-analyses.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const analyses = pages.flatMap((page) => Array.isArray(page) ? page : []);
          const exact = analyses.find((analysis) => (
            analysis.commit_sha === process.env.CODEQL_RELEASE_SHA
            && analysis.ref === "refs/heads/main"
            && analysis.tool?.name === "CodeQL"
            && /(?:^|\/)language:javascript-typescript$/u.test(String(analysis.category || ""))
          ));
          if (!exact) process.exit(1);
          NODE
            then
              codeql_analysis_ready=true
              break
            fi
            sleep 5
          done
          test "$codeql_analysis_ready" = true || {
            echo "exact-SHA JavaScript/TypeScript CodeQL analysis was not available" >&2
            exit 1
          }

          gh_api_read "$RUNNER_TEMP/codeql-open-alerts.json" \
            --paginate --slurp --method GET \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref=refs/heads/main -f tool_name=CodeQL -F per_page=100
          mkdir -p release-evidence/authorization
          umask 077
          CODEQL_RELEASE_SHA="$RELEASE_SHA" node --input-type=module \
            - "$RUNNER_TEMP/codeql-analyses.json" "$RUNNER_TEMP/codeql-open-alerts.json" \
            release-evidence/authorization/codeql-gate.json <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";
          const [analysesFile, alertsFile, output] = process.argv.slice(2);
          const flattenPages = (filename, label) => {
            const pages = JSON.parse(readFileSync(filename, "utf8"));
            assert.ok(Array.isArray(pages) && pages.every((page) => Array.isArray(page)), `${label} pagination is invalid`);
            const values = pages.flat();
            assert.ok(
              values.every((value) => value && typeof value === "object" && !Array.isArray(value)),
              `${label} entry is invalid`,
            );
            return values;
          };
          const analyses = flattenPages(analysesFile, "CodeQL analyses").filter((analysis) => (
            analysis.commit_sha === process.env.CODEQL_RELEASE_SHA
            && analysis.ref === "refs/heads/main"
            && analysis.tool?.name === "CodeQL"
            && /(?:^|\/)language:javascript-typescript$/u.test(String(analysis.category || ""))
          ));
          assert.ok(analyses.length > 0, "missing exact-SHA JavaScript/TypeScript CodeQL analysis");
          assert.ok(analyses.length <= 32, "too many exact-SHA CodeQL analyses for bounded release evidence");
          const minimumRulesCount = 103;
          const normalizedAnalyses = analyses.map((analysis) => {
            assert.ok(Number.isSafeInteger(analysis.id) && analysis.id > 0, "invalid CodeQL analysis ID");
            assert.ok(Number.isSafeInteger(analysis.results_count) && analysis.results_count >= 0, "invalid CodeQL result count");
            assert.ok(Number.isSafeInteger(analysis.rules_count), "invalid CodeQL rule count");
            const resultsCount = analysis.results_count;
            const rulesCount = analysis.rules_count;
            assert.equal(resultsCount, 0, "an exact-SHA JavaScript/TypeScript CodeQL analysis contains results");
            assert.ok(Number.isSafeInteger(rulesCount) && rulesCount >= minimumRulesCount, "exact-SHA CodeQL rule coverage is below the trusted floor");
            assert.equal(String(analysis.error || ""), "", "exact-SHA CodeQL analysis contains an error");
            assert.equal(String(analysis.warning || ""), "", "exact-SHA CodeQL analysis contains a warning");
            assert.ok(Number.isFinite(Date.parse(String(analysis.created_at || ""))), "invalid CodeQL analysis timestamp");
            return { analysis, resultsCount, rulesCount };
          });
          assert.ok(
            normalizedAnalyses.some(({ analysis }) => analysis.analysis_key === "dynamic/github-code-scanning/codeql:upload"),
            "missing trusted dynamic CodeQL analysis key",
          );
          assert.equal(
            new Set(normalizedAnalyses.map(({ analysis }) => analysis.id)).size,
            normalizedAnalyses.length,
            "duplicate exact-SHA CodeQL analysis ID",
          );
          const alerts = flattenPages(alertsFile, "CodeQL alerts");
          for (const alert of alerts) {
            assert.equal(alert.state, "open", "code-scanning alert query returned a non-open alert");
            assert.equal(alert.tool?.name, "CodeQL", "code-scanning alert query returned a non-CodeQL alert");
            assert.equal(alert.most_recent_instance?.ref, "refs/heads/main", "code-scanning alert query escaped main");
          }
          assert.equal(alerts.length, 0, "main has open CodeQL alerts after the exact-SHA JavaScript/TypeScript analysis");
          const analysisIds = normalizedAnalyses.map(({ analysis }) => analysis.id).sort((left, right) => left - right);
          const categories = [...new Set(normalizedAnalyses.map(({ analysis }) => analysis.category))].sort();
          const observedMinimumRulesCount = Math.min(...normalizedAnalyses.map(({ rulesCount }) => rulesCount));
          const observedMaximumRulesCount = Math.max(...normalizedAnalyses.map(({ rulesCount }) => rulesCount));
          writeFileSync(output, `${JSON.stringify({
            checkedAt: new Date().toISOString(),
            commitSha: process.env.CODEQL_RELEASE_SHA,
            ref: "refs/heads/main",
            workflowPath: "dynamic/github-code-scanning/codeql",
            workflowConclusion: "success",
            language: "javascript-typescript",
            analysisIds,
            categories,
            analysisCount: normalizedAnalyses.length,
            resultsCount: 0,
            minimumRulesCount: observedMinimumRulesCount,
            maximumRulesCount: observedMaximumRulesCount,
            trustedRulesFloor: minimumRulesCount,
            openAlertCount: 0,
          }, null, 2)}\n`);
          NODE

          gh_api_read "$RUNNER_TEMP/codeql-runs-final.json" \
            --paginate --slurp --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$codeql_workflow_id/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -F per_page=100
          CODEQL_RELEASE_SHA="$RELEASE_SHA" node --input-type=module - "$RUNNER_TEMP/codeql-runs-final.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.ok(Array.isArray(pages) && pages.every((page) => (
            page && typeof page === "object" && !Array.isArray(page) && Array.isArray(page.workflow_runs)
          )), "CodeQL run pagination is invalid");
          const allRuns = pages.flatMap((page) => page.workflow_runs);
          assert.ok(allRuns.every((run) => run && typeof run === "object" && !Array.isArray(run)), "CodeQL run entry is invalid");
          const exact = allRuns.filter((run) => (
            run.path === "dynamic/github-code-scanning/codeql"
            && run.head_sha === process.env.CODEQL_RELEASE_SHA
            && run.head_branch === "main"
          ));
          const runs = exact.map((run) => {
            assert.ok(Number.isSafeInteger(run.id) && run.id > 0, "invalid exact-SHA CodeQL run ID");
            assert.ok(Number.isSafeInteger(run.run_number) && run.run_number > 0, "invalid exact-SHA CodeQL run number");
            assert.ok(Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0, "invalid exact-SHA CodeQL run attempt");
            assert.ok(typeof run.status === "string" && run.status.length > 0, "invalid exact-SHA CodeQL run status");
            assert.ok(Number.isFinite(Date.parse(String(run.created_at || ""))), "invalid exact-SHA CodeQL creation timestamp");
            assert.ok(Number.isFinite(Date.parse(String(run.run_started_at || ""))), "invalid exact-SHA CodeQL attempt start timestamp");
            assert.ok(Number.isFinite(Date.parse(String(run.updated_at || ""))), "invalid exact-SHA CodeQL update timestamp");
            if (run.status === "completed") {
              assert.ok(typeof run.conclusion === "string" && run.conclusion.length > 0, "completed CodeQL run lacks a conclusion");
            } else {
              assert.equal(run.conclusion, null, "active CodeQL run has a conclusion");
            }
            return run;
          });
          assert.ok(runs.length > 0, "missing exact-SHA CodeQL run");
          assert.equal(new Set(runs.map((run) => run.id)).size, runs.length, "duplicate exact-SHA CodeQL run ID");
          assert.equal(new Set(runs.map((run) => run.run_number)).size, runs.length, "duplicate exact-SHA CodeQL run number");
          assert.equal(runs.some((run) => run.status !== "completed"), false, "an exact-SHA CodeQL run is still active");
          const latestStartedAt = Math.max(...runs.map((run) => Date.parse(run.run_started_at)));
          const latest = runs.filter((run) => Date.parse(run.run_started_at) === latestStartedAt);
          assert.ok(
            latest.length > 0 && latest.every((run) => run.conclusion === "success"),
            "latest exact-SHA CodeQL run attempts did not all succeed",
          );
          NODE

          gh_api_read "$RUNNER_TEMP/codeql-analyses-final.json" \
            --paginate --slurp --method GET \
            "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
            -f ref=refs/heads/main -f tool_name=CodeQL -F per_page=100
          gh_api_read "$RUNNER_TEMP/codeql-open-alerts-final.json" \
            --paginate --slurp --method GET \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f state=open -f ref=refs/heads/main -f tool_name=CodeQL -F per_page=100
          CODEQL_RELEASE_SHA="$RELEASE_SHA" node --input-type=module \
            - "$RUNNER_TEMP/codeql-analyses.json" "$RUNNER_TEMP/codeql-analyses-final.json" \
            "$RUNNER_TEMP/codeql-open-alerts-final.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const [beforeFile, afterFile, alertsFile] = process.argv.slice(2);
          const flattenPages = (filename, label) => {
            const pages = JSON.parse(readFileSync(filename, "utf8"));
            assert.ok(Array.isArray(pages) && pages.every((page) => Array.isArray(page)), `${label} pagination is invalid`);
            const values = pages.flat();
            assert.ok(
              values.every((value) => value && typeof value === "object" && !Array.isArray(value)),
              `${label} entry is invalid`,
            );
            return values;
          };
          const exactIds = (filename) => flattenPages(filename, "CodeQL analyses")
            .filter((analysis) => (
              analysis.commit_sha === process.env.CODEQL_RELEASE_SHA
              && analysis.ref === "refs/heads/main"
              && analysis.tool?.name === "CodeQL"
              && /(?:^|\/)language:javascript-typescript$/u.test(String(analysis.category || ""))
            ))
            .map((analysis) => analysis.id)
            .sort((left, right) => left - right);
          assert.deepEqual(exactIds(afterFile), exactIds(beforeFile), "exact-SHA CodeQL analysis set changed during authorization");
          const alerts = flattenPages(alertsFile, "CodeQL alerts");
          assert.equal(alerts.length, 0, "main gained an open CodeQL alert during authorization");
          NODE
          gh_api_read "$RUNNER_TEMP/codeql-runs-settled.json" \
            --paginate --slurp --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$codeql_workflow_id/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -F per_page=100
          CODEQL_RELEASE_SHA="$RELEASE_SHA" node --input-type=module \
            - "$RUNNER_TEMP/codeql-runs-final.json" "$RUNNER_TEMP/codeql-runs-settled.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const exactRuns = (filename) => {
            const pages = JSON.parse(readFileSync(filename, "utf8"));
            assert.ok(Array.isArray(pages) && pages.every((page) => (
              page && typeof page === "object" && !Array.isArray(page) && Array.isArray(page.workflow_runs)
            )), "settled CodeQL run pagination is invalid");
            const allRuns = pages.flatMap((page) => page.workflow_runs);
            assert.ok(allRuns.every((run) => run && typeof run === "object" && !Array.isArray(run)), "settled CodeQL run entry is invalid");
            const runs = allRuns.filter((run) => (
              run.path === "dynamic/github-code-scanning/codeql"
              && run.head_sha === process.env.CODEQL_RELEASE_SHA
              && run.head_branch === "main"
            ));
            const normalized = runs.map((run) => {
              assert.ok(Number.isSafeInteger(run.id) && run.id > 0, "invalid exact-SHA CodeQL run ID");
              assert.ok(Number.isSafeInteger(run.run_number) && run.run_number > 0, "invalid exact-SHA CodeQL run number");
              assert.ok(Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0, "invalid exact-SHA CodeQL run attempt");
              assert.ok(typeof run.status === "string" && run.status.length > 0, "invalid exact-SHA CodeQL run status");
              assert.ok(Number.isFinite(Date.parse(String(run.created_at || ""))), "invalid exact-SHA CodeQL creation timestamp");
              assert.ok(Number.isFinite(Date.parse(String(run.run_started_at || ""))), "invalid exact-SHA CodeQL attempt start timestamp");
              assert.ok(Number.isFinite(Date.parse(String(run.updated_at || ""))), "invalid exact-SHA CodeQL update timestamp");
              if (run.status === "completed") {
                assert.ok(typeof run.conclusion === "string" && run.conclusion.length > 0, "completed CodeQL run lacks a conclusion");
              } else {
                assert.equal(run.conclusion, null, "active CodeQL run has a conclusion");
              }
              return {
                id: run.id,
                runNumber: run.run_number,
                runAttempt: run.run_attempt,
                status: run.status,
                conclusion: run.conclusion,
                createdAt: run.created_at,
                runStartedAt: run.run_started_at,
                updatedAt: run.updated_at,
              };
            }).sort((left, right) => left.id - right.id);
            assert.equal(new Set(normalized.map((run) => run.id)).size, normalized.length, "duplicate exact-SHA CodeQL run ID");
            assert.equal(new Set(normalized.map((run) => run.runNumber)).size, normalized.length, "duplicate exact-SHA CodeQL run number");
            return normalized;
          };
          const before = exactRuns(process.argv[2]);
          const runs = exactRuns(process.argv[3]);
          assert.deepEqual(
            runs,
            before,
            "exact-SHA CodeQL run attempt set changed during authorization",
          );
          assert.ok(runs.length > 0, "missing settled exact-SHA CodeQL run");
          assert.equal(runs.some((run) => run.status !== "completed"), false, "an exact-SHA CodeQL run started during authorization");
          const latestStartedAt = Math.max(...runs.map((run) => Date.parse(run.runStartedAt)));
          const latest = runs.filter((run) => Date.parse(run.runStartedAt) === latestStartedAt);
          assert.ok(
            latest.length > 0 && latest.every((run) => run.conclusion === "success"),
            "latest settled exact-SHA CodeQL run attempts did not all succeed",
          );
          NODE
          rm -f -- \
            "$RUNNER_TEMP/codeql-analyses.json" \
            "$RUNNER_TEMP/codeql-analyses-final.json" \
            "$RUNNER_TEMP/codeql-open-alerts.json" \
            "$RUNNER_TEMP/codeql-open-alerts-final.json" \
            "$RUNNER_TEMP/codeql-runs-final.json" \
            "$RUNNER_TEMP/codeql-runs-settled.json"

          # Candidate code runs without the API token and only after ancestry,
          # merged-PR, exact-CI, and exact-CodeQL evidence established trust.
          env -u GH_TOKEN node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

          {
            echo "release_sha=$RELEASE_SHA"
            echo "base_sha=$base_sha"
            echo "pull_request=$pull_request"
          } >> "$GITHUB_OUTPUT"

      - name: Store bounded CodeQL release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-release-evidence-${{ steps.gate.outputs.release_sha }}
          path: release-evidence/authorization/codeql-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Classify the release scope
        id: scope
        run: node scripts/release-scope.mjs "${{ steps.gate.outputs.base_sha }}" "${{ steps.gate.outputs.release_sha }}"

  validate:
    name: Revalidate and build authorized release
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}

    steps:
      - name: Check out the authorized SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Revalidate release inputs without environment secrets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm ci
          npm run check:ops
          npm run check:migrations
          npm run build
          git diff --check

      - name: Store the exact validated build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-${{ env.RELEASE_SHA }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  staging:
    name: Migrate, deploy, and verify staging
    needs: [authorize, validate]
    if: needs.authorize.outputs.deploy == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://grihagrid-staging.prakhargupta267.workers.dev
    outputs:
      version_id: ${{ steps.version.outputs.version_id }}
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
      BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
      ORIGIN: https://grihagrid-staging.prakhargupta267.workers.dev

    steps:
      - name: Check out the authorized SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Restore the exact validated build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/grihagrid-release-build

      - name: Prepare the fresh privileged runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f "$RUNNER_TEMP/grihagrid-release-build/client/index.html"
          test -f "$RUNNER_TEMP/grihagrid-release-build/server/index.js"
          if find "$RUNNER_TEMP/grihagrid-release-build" -type l -print -quit | grep -q .; then
            echo "validated build artifacts may not contain symbolic links" >&2
            exit 1
          fi
          rm -rf -- "$GITHUB_WORKSPACE/dist"
          mv -- "$RUNNER_TEMP/grihagrid-release-build" "$GITHUB_WORKSPACE/dist"
          test -f dist/client/index.html
          test -f dist/server/index.js
          mkdir -p release-evidence/staging
          npm install --global --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org "wrangler@$WRANGLER_VERSION"
          test "$(wrangler --version)" = "$WRANGLER_VERSION"

      - name: Enforce immutable, forward-only migrations
        run: |
          set -euo pipefail
          migration_changes="$(git diff --name-status "$BASE_SHA" "$RELEASE_SHA" -- migrations)"
          if [ -n "$migration_changes" ]; then
            while IFS=$'\t' read -r status first_path second_path; do
              if [ "$status" != "A" ]; then
                echo "existing migrations are immutable; found status $status" >&2
                exit 1
              fi
              filename="${first_path##*/}"
              [[ "$filename" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]
              if (( 10#${BASH_REMATCH[1]} <= 12 )); then
                echo "new migrations must follow the trusted 0012 baseline" >&2
                exit 1
              fi
            done <<< "$migration_changes"
          fi
          policy_migrations=()
          for migration in migrations/*.sql; do
            filename="${migration##*/}"
            sequence="${filename%%_*}"
            [[ "$sequence" =~ ^[0-9]{4}$ ]]
            if (( 10#$sequence > 12 )); then policy_migrations+=("$migration"); fi
          done
          if (( ${#policy_migrations[@]} > 0 )); then
            node scripts/check-migration-policy.mjs "${policy_migrations[@]}"
          fi

      - name: Reconfirm current main before staging inspection
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Record current staging Worker
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler deployments status --env staging --json > "$RUNNER_TEMP/staging-pre-deploy.json"
          previous_version="$(node --input-type=module - "$RUNNER_TEMP/staging-pre-deploy.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const input = process.argv[2];
          const status = JSON.parse(readFileSync(input, "utf8"));
          const active = status.versions?.filter((version) => version.percentage === 100) || [];
          if (active.length !== 1 || !/^[0-9a-f-]{36}$/u.test(active[0].version_id || "")) process.exit(1);
          writeFileSync("release-evidence/staging/pre-deploy-status.json", `${JSON.stringify({
            activeVersion: active[0].version_id,
            trafficPercentage: 100,
          }, null, 2)}\n`);
          process.stdout.write(active[0].version_id);
          NODE
          )"
          wrangler versions view "$previous_version" --env staging --json > "$RUNNER_TEMP/staging-previous-version.json"
          previous_release_sha="$(node --input-type=module - "$RUNNER_TEMP/staging-previous-version.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const matches = String(version.annotations?.["workers/message"] || "").match(/\b[a-f0-9]{40}\b/gu) || [];
          if (matches.length !== 1) process.exit(1);
          process.stdout.write(matches[0]);
          NODE
          )"
          git merge-base --is-ancestor "$previous_release_sha" "$RELEASE_SHA" || {
            echo "release would move staging behind its currently deployed source history" >&2
            exit 1
          }
          {
            echo "previous_version=$previous_version"
            echo "previous_release_sha=$previous_release_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Inspect pending staging migrations and aggregate data state
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 migrations list DB --remote --env staging \
            | tee release-evidence/staging/pre-migration-list.txt
          wrangler d1 execute DB --remote --env staging --json --command \
            "WITH entities(entity) AS (VALUES ('users'),('sessions'),('projects'),('reports'),('orders'),('payment_webhook_events')) SELECT entity,CASE entity WHEN 'users' THEN (SELECT COUNT(*) FROM users) WHEN 'sessions' THEN (SELECT COUNT(*) FROM sessions) WHEN 'projects' THEN (SELECT COUNT(*) FROM projects) WHEN 'reports' THEN (SELECT COUNT(*) FROM reports) WHEN 'orders' THEN (SELECT COUNT(*) FROM orders) WHEN 'payment_webhook_events' THEN (SELECT COUNT(*) FROM payment_webhook_events) END AS row_count FROM entities;" \
            > "$RUNNER_TEMP/staging-pre-migration-counts.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT (SELECT COUNT(*) FROM projects WHERE NOT json_valid(input_json) OR json_type(input_json)!='object') AS invalid_input_rows,(SELECT COUNT(DISTINCT p.id) FROM projects p,json_each(p.input_json) field WHERE field.key NOT IN ('width','length','city','facing','floors','bedrooms','bathrooms','parking','style','quality','roadWidthFt','plotShape','accessibility','futureUse','budgetLakh')) AS unknown_input_rows,(SELECT COUNT(*) FROM projects p,json_each(p.input_json) field WHERE field.key='soilReport') AS soil_report_keys,(SELECT COUNT(*) FROM project_revision_reports rr WHERE rr.report_schema_version=2 AND (NOT json_valid(rr.content_json) OR json_type(rr.content_json,'$.risks')!='array' OR NOT EXISTS (SELECT 1 FROM json_each(rr.content_json,'$.risks') risk WHERE risk.type='text' AND risk.value='Foundation assumptions must be validated through a geotechnical investigation.'))) AS unsafe_revision_reports,(SELECT COUNT(*) FROM reports report WHERE report.version=2 AND (NOT json_valid(report.content_json) OR json_type(report.content_json,'$.risks')!='array' OR NOT EXISTS (SELECT 1 FROM json_each(report.content_json,'$.risks') risk WHERE risk.type='text' AND risk.value='Foundation assumptions must be validated through a geotechnical investigation.'))) AS unsafe_current_reports;" \
            > "$RUNNER_TEMP/staging-pre-migration-audit.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM users ORDER BY id;" > "$RUNNER_TEMP/staging-pre-migration-users.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM sessions ORDER BY id;" > "$RUNNER_TEMP/staging-pre-migration-sessions.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM projects ORDER BY id;" > "$RUNNER_TEMP/staging-pre-migration-projects.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM reports ORDER BY id;" > "$RUNNER_TEMP/staging-pre-migration-reports.json"
          node scripts/release-db-evidence.mjs pre staging \
            "$RUNNER_TEMP/staging-pre-migration-counts.json" \
            "$RUNNER_TEMP/staging-pre-migration-audit.json" \
            "$RUNNER_TEMP/staging-pre-migration-users.json" \
            "$RUNNER_TEMP/staging-pre-migration-sessions.json" \
            "$RUNNER_TEMP/staging-pre-migration-projects.json" \
            "$RUNNER_TEMP/staging-pre-migration-reports.json" \
            release-evidence/staging/pre-migration-proof.json
          if grep -Fq "No migrations to apply!" release-evidence/staging/pre-migration-list.txt; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0013_report_feedback_and_intake_hardening.sql" release-evidence/staging/pre-migration-list.txt; then
            echo "feedback_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "feedback_pending=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0016_report_handoff_links.sql" release-evidence/staging/pre-migration-list.txt; then
            echo "report_share_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_share_pending=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0017_login_attempt_fence.sql" release-evidence/staging/pre-migration-list.txt; then
            echo "login_attempt_fence_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "login_attempt_fence_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject unexpected staging migration drift
        id: migration_drift_guard
        env:
          AUTHORIZED_MIGRATIONS: ${{ needs.authorize.outputs.migrations }}
          REMOTE_PENDING_MIGRATIONS: ${{ steps.migrations.outputs.pending }}
        run: |
          set -euo pipefail
          if [[ "$AUTHORIZED_MIGRATIONS" == "false" && "$REMOTE_PENDING_MIGRATIONS" == "true" ]]; then
            echo "staging has pending migrations outside the authorized release diff" >&2
            exit 1
          fi

      - name: Create protected staging export and recovery point
        id: raw_backup
        if: steps.migrations.outputs.pending == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          backup_directory="$RUNNER_TEMP/grihagrid-staging-pre-migration"
          mkdir -m 700 "$backup_directory"
          raw_backup="$backup_directory/d1-pre-migration.sql"
          wrangler d1 export DB --remote --env staging --skip-confirmation --output "$raw_backup"
          chmod 600 "$raw_backup"
          raw_sha256="$(sha256sum "$raw_backup" | awk '{ print $1 }')"
          raw_permissions="$(stat -c '%a' "$raw_backup")"
          test "$raw_permissions" = "600"
          wrangler d1 time-travel info DB --env staging --json > "$backup_directory/time-travel.json"
          bookmark="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).bookmark' "$backup_directory/time-travel.json")"
          [[ "$bookmark" =~ ^[A-Za-z0-9._:-]{16,256}$ ]]
          {
            echo "backup_directory=$backup_directory"
            echo "raw_sha256=$raw_sha256"
            echo "raw_permissions=$raw_permissions"
            echo "bookmark=$bookmark"
          } >> "$GITHUB_OUTPUT"

      - name: Encrypt and verify protected staging export
        id: backup
        if: steps.migrations.outputs.pending == 'true'
        env:
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
          BACKUP_DIRECTORY: ${{ steps.raw_backup.outputs.backup_directory }}
          RAW_SHA256: ${{ steps.raw_backup.outputs.raw_sha256 }}
          RAW_PERMISSIONS: ${{ steps.raw_backup.outputs.raw_permissions }}
          BOOKMARK: ${{ steps.raw_backup.outputs.bookmark }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          test "${#D1_BACKUP_PASSPHRASE}" -ge 20
          umask 077
          raw_backup="$BACKUP_DIRECTORY/d1-pre-migration.sql"
          encrypted_backup="$BACKUP_DIRECTORY/d1-pre-migration.sql.ggrid"
          verified_backup="$BACKUP_DIRECTORY/d1-verified.sql"
          node scripts/backup-crypto.mjs encrypt "$raw_backup" "$encrypted_backup"
          node scripts/backup-crypto.mjs decrypt "$encrypted_backup" "$verified_backup"
          test "$(sha256sum "$verified_backup" | awk '{ print $1 }')" = "$RAW_SHA256"
          encrypted_sha256="$(sha256sum "$encrypted_backup" | awk '{ print $1 }')"
          rm -f -- "$raw_backup" "$verified_backup" "$BACKUP_DIRECTORY/time-travel.json"
          ENCRYPTED_SHA256="$encrypted_sha256" node --input-type=module - "$BACKUP_DIRECTORY/manifest.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(process.argv[2], `${JSON.stringify({
            format: "GGRIDBK1-AES-256-GCM",
            keyVersion: process.env.BACKUP_KEY_VERSION,
            environment: "staging",
            releaseSha: process.env.RELEASE_SHA,
            createdAt: new Date().toISOString(),
            rawSha256: process.env.RAW_SHA256,
            rawPermissions: process.env.RAW_PERMISSIONS,
            encryptedSha256: process.env.ENCRYPTED_SHA256,
            decryptVerification: "passed",
            timeTravelBookmark: process.env.BOOKMARK,
            previousWorkerVersion: process.env.PREVIOUS_VERSION,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          cp "$BACKUP_DIRECTORY/manifest.json" release-evidence/staging/pre-migration-backup-manifest.json
          echo "backup_directory=$BACKUP_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Store encrypted staging export
        if: steps.migrations.outputs.pending == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-d1-pre-migration-${{ env.RELEASE_SHA }}
          path: ${{ steps.backup.outputs.backup_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Reconfirm current main before staging database mutation
        id: current_main_db
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Apply and verify staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIGRATIONS_PENDING: ${{ steps.migrations.outputs.pending }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${{ steps.migrations.outputs.pending }}" = "true" ]; then
            wrangler d1 migrations apply DB --remote --env staging
          fi
          if [ "${{ steps.migrations.outputs.report_share_pending }}" != "true" ]; then
            wrangler d1 execute DB --remote --env staging --json --command \
              "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
              > "$RUNNER_TEMP/staging-report-handoff-pre-activation-close.json"
            REPORT_HANDOFF_EXPECTED_ENABLED=false \
              node scripts/release-db-evidence.mjs handoff-control staging \
                "$RUNNER_TEMP/staging-report-handoff-pre-activation-close.json" \
                release-evidence/staging/pre-activation-report-handoff-closed.json
          fi
          wrangler d1 migrations list DB --remote --env staging \
            | tee release-evidence/staging/post-migration-list.txt
          grep -Fq "No migrations to apply!" release-evidence/staging/post-migration-list.txt
          wrangler d1 execute DB --remote --env staging --json --command "PRAGMA foreign_key_check;" \
            > release-evidence/staging/foreign-key-check.json
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT type,name FROM sqlite_schema WHERE type IN ('table','index','trigger') AND name NOT LIKE 'sqlite_%' ORDER BY type,name;" \
            > release-evidence/staging/schema-objects.json
          wrangler d1 execute DB --remote --env staging --json --command \
            "WITH target_tables(table_name) AS (VALUES ('users'),('sessions'),('password_change_attempt_counters'),('login_attempt_fences'),('report_share_read_counters'),('report_share_create_counters'),('report_handoff_controls'),('projects'),('orders'),('project_revisions'),('report_feedback'),('report_shares')) SELECT target_tables.table_name,columns.name FROM target_tables JOIN pragma_table_info(target_tables.table_name) AS columns ORDER BY target_tables.table_name,columns.name;" \
            > "$RUNNER_TEMP/staging-schema-columns.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "WITH entities(entity) AS (VALUES ('users'),('sessions'),('projects'),('reports'),('orders'),('payment_webhook_events')) SELECT entity,CASE entity WHEN 'users' THEN (SELECT COUNT(*) FROM users) WHEN 'sessions' THEN (SELECT COUNT(*) FROM sessions) WHEN 'projects' THEN (SELECT COUNT(*) FROM projects) WHEN 'reports' THEN (SELECT COUNT(*) FROM reports) WHEN 'orders' THEN (SELECT COUNT(*) FROM orders) WHEN 'payment_webhook_events' THEN (SELECT COUNT(*) FROM payment_webhook_events) END AS row_count FROM entities;" \
            > "$RUNNER_TEMP/staging-post-migration-counts.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM users ORDER BY id;" > "$RUNNER_TEMP/staging-post-migration-users.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM sessions ORDER BY id;" > "$RUNNER_TEMP/staging-post-migration-sessions.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM projects ORDER BY id;" > "$RUNNER_TEMP/staging-post-migration-projects.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT * FROM reports ORDER BY id;" > "$RUNNER_TEMP/staging-post-migration-reports.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT COUNT(*) AS row_count FROM report_feedback;" > "$RUNNER_TEMP/staging-post-migration-feedback-count.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT COUNT(*) AS row_count FROM report_shares;" > "$RUNNER_TEMP/staging-post-migration-report-share-count.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT COUNT(*) AS row_count FROM report_share_read_counters;" > "$RUNNER_TEMP/staging-post-migration-report-share-read-counter-count.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT COUNT(*) AS row_count FROM report_share_create_counters;" > "$RUNNER_TEMP/staging-post-migration-report-share-create-counter-count.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT COUNT(*) AS row_count FROM login_attempt_fences;" > "$RUNNER_TEMP/staging-post-migration-login-attempt-fence-count.json"
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" > "$RUNNER_TEMP/staging-post-migration-report-handoff-control.json"
          FEEDBACK_MIGRATION_PENDING="${{ steps.migrations.outputs.feedback_pending }}" \
            REPORT_SHARE_MIGRATION_PENDING="${{ steps.migrations.outputs.report_share_pending }}" \
            LOGIN_ATTEMPT_FENCE_MIGRATION_PENDING="${{ steps.migrations.outputs.login_attempt_fence_pending }}" \
            node scripts/release-db-evidence.mjs post staging \
              release-evidence/staging/pre-migration-proof.json \
              release-evidence/staging/foreign-key-check.json \
              release-evidence/staging/schema-objects.json \
              "$RUNNER_TEMP/staging-schema-columns.json" \
              "$RUNNER_TEMP/staging-post-migration-counts.json" \
              "$RUNNER_TEMP/staging-post-migration-users.json" \
              "$RUNNER_TEMP/staging-post-migration-sessions.json" \
              "$RUNNER_TEMP/staging-post-migration-projects.json" \
              "$RUNNER_TEMP/staging-post-migration-reports.json" \
              "$RUNNER_TEMP/staging-post-migration-feedback-count.json" \
              "$RUNNER_TEMP/staging-post-migration-report-share-count.json" \
              "$RUNNER_TEMP/staging-post-migration-report-share-read-counter-count.json" \
              "$RUNNER_TEMP/staging-post-migration-report-share-create-counter-count.json" \
              "$RUNNER_TEMP/staging-post-migration-login-attempt-fence-count.json" \
              "$RUNNER_TEMP/staging-post-migration-report-handoff-control.json" \
              release-evidence/staging/post-migration-proof.json

      - name: Rehearse rollback Worker against migrated staging schema
        id: rollback_compat
        if: needs.authorize.outputs.migrations == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_CANARY_EMAIL: ${{ secrets.GRIHAGRID_CANARY_EMAIL }}
          GRIHAGRID_CANARY_PASSWORD: ${{ secrets.GRIHAGRID_CANARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GRIHAGRID_CANARY_EMAIL"
          test -n "$GRIHAGRID_CANARY_PASSWORD"
          sha256sum scripts/authenticated-smoke.mjs \
            > release-evidence/staging/rollback-smoke-source.sha256
          bash scripts/run-canary-session-fence.sh snapshot staging rollback
          restore_rollback_canary_sessions() {
            status=$?
            trap - EXIT
            set +e
            attempt_outcome=completed
            if [ "$status" -ne 0 ]; then attempt_outcome=ambiguous; fi
            session_cleanup_status=0
            bash scripts/run-canary-session-fence.sh restore staging rollback \
              release-evidence/staging/rollback-canary-session-cleanup.json "$attempt_outcome" \
              || session_cleanup_status=1
            if [ "$session_cleanup_status" -ne 0 ]; then
              echo "failed to restore the exact staging rollback-canary session baseline" >&2
            fi
            if [ "$status" -eq 0 ] && [ "$session_cleanup_status" -ne 0 ]; then status=1; fi
            exit "$status"
          }
          trap restore_rollback_canary_sessions EXIT
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            node scripts/authenticated-smoke.mjs "$ORIGIN" \
            | tee release-evidence/staging/rollback-compatibility-smoke.json

      - name: Prove staging rollback rehearsal left zero database residue
        id: rollback_residue
        if: always() && steps.rollback_compat.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-db-evidence.mjs residue-sql staging \
            release-evidence/staging/rollback-compatibility-smoke.json \
            "$RUNNER_TEMP/staging-rollback-residue.sql"
          residue_sql="$(< "$RUNNER_TEMP/staging-rollback-residue.sql")"
          wrangler d1 execute DB --remote --env staging --json \
            --command "$residue_sql" \
            > "$RUNNER_TEMP/staging-rollback-residue.json"
          node scripts/release-db-evidence.mjs residue staging \
            release-evidence/staging/rollback-compatibility-smoke.json \
            "$RUNNER_TEMP/staging-rollback-residue.json" \
            release-evidence/staging/rollback-residue-proof.json

      - name: Reconfirm current main before staging Worker activation
        id: current_main_activation
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Deploy authorized SHA to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy --env staging --strict \
            --tag "main-${RELEASE_SHA:0:12}" \
            --message "GrihaGrid release $RELEASE_SHA; controls closed" \
            > "$RUNNER_TEMP/staging-deploy.log" 2>&1
          command_status=$?
          set -e
          echo "command_status=$command_status" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact staging Worker version
        id: version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND_STATUS: ${{ steps.deploy.outputs.command_status }}
        run: |
          set -euo pipefail
          wrangler deployments status --env staging --json > "$RUNNER_TEMP/staging-post-deploy.json"
          version_id="$(node --input-type=module - "$RUNNER_TEMP/staging-post-deploy.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const active = status.versions?.filter((version) => version.percentage === 100) || [];
          if (active.length !== 1) process.exit(1);
          process.stdout.write(String(active[0].version_id || ""));
          NODE
          )"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]]
          test "$version_id" != "${{ steps.previous.outputs.previous_version }}"
          wrangler versions view "$version_id" --env staging --json > "$RUNNER_TEMP/staging-version.json"
          EXPECTED_MESSAGE="GrihaGrid release $RELEASE_SHA; controls closed" EXPECTED_TAG="main-${RELEASE_SHA:0:12}" \
            VERSION_ID="$version_id" DEPLOY_COMMAND_STATUS="$DEPLOY_COMMAND_STATUS" \
            node --input-type=module - "$RUNNER_TEMP/staging-version.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (version.id !== process.env.VERSION_ID
            || version.annotations?.["workers/message"] !== process.env.EXPECTED_MESSAGE
            || version.annotations?.["workers/tag"] !== process.env.EXPECTED_TAG) process.exit(1);
          writeFileSync("release-evidence/staging/post-deploy-status.json", `${JSON.stringify({
            activeVersion: version.id,
            trafficPercentage: 100,
            releaseSha: process.env.RELEASE_SHA,
            tag: process.env.EXPECTED_TAG,
            deployCommandExit: Number(process.env.DEPLOY_COMMAND_STATUS),
          }, null, 2)}\n`);
          NODE
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Disable staging report handoff before unverified rollback
        id: handoff_unverified_fail_closed
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env staging --json --command \
            "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/staging-report-handoff-unverified-disable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-report-handoff-unverified-disable.json" \
              release-evidence/staging/unverified-rollback-report-handoff-disabled.json

      - name: Roll back an unverified compatible staging activation
        id: rollback_unverified
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler rollback "${{ steps.previous.outputs.previous_version }}" --env staging --yes \
            --message "Fail-closed rollback of unverified release $RELEASE_SHA"

      - name: Verify the exact staging version after unverified rollback
        if: always() && steps.rollback_unverified.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_PAID_CHECKOUT: "false"
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            > release-evidence/staging/unverified-deploy-rollback.json
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/staging-unverified-rollback-report-handoff-control.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-unverified-rollback-report-handoff-control.json" \
              release-evidence/staging/unverified-rollback-report-handoff-control.json

      - name: Wait for sustained exact staging smoke samples
        id: propagation
        continue-on-error: true
        env:
          EXPECT_PAID_CHECKOUT: "false"
          EXPECT_REPORT_HANDOFF: "false"
          GRIHAGRID_RELEASE_ORIGIN: ${{ env.ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" | tee release-evidence/staging/public-smoke.json

      - name: Gate staging readiness latency on the exact version
        id: readiness_latency
        if: steps.propagation.outcome == 'success'
        continue-on-error: true
        env:
          GRIHAGRID_READINESS_ORIGIN: ${{ env.ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ steps.version.outputs.version_id }}
          GRIHAGRID_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECT_AI_PLANNING_BRIEF: "false"
          EXPECT_REPORT_HANDOFF: "false"
        run: |
          set -euo pipefail
          node scripts/readiness-latency.mjs "$GRIHAGRID_READINESS_ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            | tee release-evidence/staging/readiness-latency.json

      - name: Run staging authenticated canary under bounded handoff activation
        id: canary
        if: steps.propagation.outcome == 'success' && steps.readiness_latency.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_RELEASE_ID: ${{ steps.version.outputs.version_id }}
          GRIHAGRID_CANARY_EMAIL: ${{ secrets.GRIHAGRID_CANARY_EMAIL }}
          GRIHAGRID_CANARY_PASSWORD: ${{ secrets.GRIHAGRID_CANARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GRIHAGRID_CANARY_EMAIL"
          test -n "$GRIHAGRID_CANARY_PASSWORD"
          bash scripts/run-canary-session-fence.sh snapshot staging candidate
          reclose_report_handoff_after_canary() {
            status=$?
            trap - EXIT
            set +e
            env -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
              wrangler d1 execute DB --remote --env staging --json --command \
              "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
              > "$RUNNER_TEMP/staging-report-handoff-canary-reclose.json"
            reclose_status=$?
            if [ "$reclose_status" -eq 0 ]; then
              env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
                -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
                REPORT_HANDOFF_EXPECTED_ENABLED=false \
                node scripts/release-db-evidence.mjs handoff-control staging \
                  "$RUNNER_TEMP/staging-report-handoff-canary-reclose.json" \
                  release-evidence/staging/report-handoff-canary-reclosed.json
              proof_status=$?
            else
              proof_status=1
              echo "failed to re-close staging report handoff after the authenticated canary" >&2
            fi
            session_cleanup_status=0
            attempt_outcome=completed
            if [ "$status" -ne 0 ]; then attempt_outcome=ambiguous; fi
            bash scripts/run-canary-session-fence.sh restore staging candidate \
              release-evidence/staging/canary-session-cleanup.json "$attempt_outcome" \
              || session_cleanup_status=1
            if [ "$session_cleanup_status" -ne 0 ]; then
              echo "failed to restore the exact staging canary session baseline" >&2
            fi
            if [ "$status" -eq 0 ] && { [ "$reclose_status" -ne 0 ] || [ "$proof_status" -ne 0 ] || [ "$session_cleanup_status" -ne 0 ]; }; then
              status=1
            fi
            exit "$status"
          }
          trap reclose_report_handoff_after_canary EXIT
          env -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
            wrangler d1 execute DB --remote --env staging --json --command \
            "UPDATE report_handoff_controls SET enabled=1,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/staging-report-handoff-canary-enable.json"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
            REPORT_HANDOFF_EXPECTED_ENABLED=true \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-report-handoff-canary-enable.json" \
              release-evidence/staging/report-handoff-canary-enabled.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            node scripts/authenticated-smoke.mjs "$ORIGIN" \
            | tee release-evidence/staging/authenticated-smoke.json

      - name: Prove staging canary left zero database residue
        id: residue
        if: always() && steps.canary.outcome != 'skipped'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-db-evidence.mjs residue-sql staging \
            release-evidence/staging/authenticated-smoke.json \
            "$RUNNER_TEMP/staging-canary-residue.sql"
          residue_sql="$(< "$RUNNER_TEMP/staging-canary-residue.sql")"
          wrangler d1 execute DB --remote --env staging --json \
            --command "$residue_sql" \
            > "$RUNNER_TEMP/staging-canary-residue.json"
          node scripts/release-db-evidence.mjs residue staging \
            release-evidence/staging/authenticated-smoke.json \
            "$RUNNER_TEMP/staging-canary-residue.json" \
            release-evidence/staging/post-canary-residue-proof.json

      - name: Prove staging report handoff reclosed after authenticated canary
        id: handoff_reclosed
        if: always() && steps.canary.outcome != 'skipped'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/staging-report-handoff-reclosed.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-report-handoff-reclosed.json" \
              release-evidence/staging/report-handoff-reclosed-control.json
          node --input-type=module > release-evidence/staging/report-handoff-disabled-http.json <<'NODE'
          import assert from "node:assert/strict";
          const origin = new URL(process.env.ORIGIN);
          const request = async (path, init, expectedStatus) => {
            const response = await fetch(new URL(path, origin), {
              ...init,
              redirect: "error",
              signal: AbortSignal.timeout(15_000),
            });
            assert.equal(response.status, expectedStatus, `${path} returned ${response.status}`);
            return response.json();
          };
          const readiness = await request("/api/readiness", {}, 200);
          assert.equal(readiness.releaseId, process.env.EXPECTED_RELEASE_ID);
          assert.equal(readiness.checks?.reportShareSchema, "current");
          assert.equal(readiness.checks?.reportHandoffControl, "disabled");
          assert.equal(readiness.checks?.reportShareAbuseHashing, "configured");
          assert.equal(readiness.capabilities?.reportHandoff, false);
          const redemption = await request("/api/shared/report", {
            method: "POST",
            headers: { "content-type": "application/json", origin: origin.origin },
            body: JSON.stringify({ token: "A".repeat(43) }),
          }, 503);
          assert.equal(redemption.code, "report_handoff_disabled");
          process.stdout.write(`${JSON.stringify({
            checkedAt: new Date().toISOString(),
            releaseId: readiness.releaseId,
            control: readiness.checks.reportHandoffControl,
            reportHandoff: readiness.capabilities.reportHandoff,
            redemptionStatus: 503,
            redemptionCode: redemption.code,
          }, null, 2)}\n`);
          NODE

      - name: Restore and verify staging report handoff control
        id: handoff_restore
        if: >-
          always() &&
          steps.canary.outcome == 'success' &&
          steps.residue.outcome == 'success' &&
          steps.handoff_reclosed.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          umask 077
          reclose_report_handoff_on_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              set +e
              wrangler d1 execute DB --remote --env staging --json --command \
                "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
                > "$RUNNER_TEMP/staging-report-handoff-restore-failure-disable.json"
              reclose_status=$?
              if [ "$reclose_status" -eq 0 ]; then
                REPORT_HANDOFF_EXPECTED_ENABLED=false \
                  node scripts/release-db-evidence.mjs handoff-control staging \
                    "$RUNNER_TEMP/staging-report-handoff-restore-failure-disable.json" \
                    release-evidence/staging/report-handoff-restore-failure-control.json
              else
                echo "failed to re-close staging report handoff after restoration proof failure" >&2
              fi
            fi
            exit "$status"
          }
          trap reclose_report_handoff_on_failure EXIT
          wrangler d1 execute DB --remote --env staging --json --command \
            "UPDATE report_handoff_controls SET enabled=1,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/staging-report-handoff-enable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=true \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-report-handoff-enable.json" \
              release-evidence/staging/report-handoff-enabled-control.json
          node --input-type=module > release-evidence/staging/report-handoff-enabled-http.json <<'NODE'
          import assert from "node:assert/strict";
          const origin = new URL(process.env.ORIGIN);
          const request = async (path, init, expectedStatus) => {
            const response = await fetch(new URL(path, origin), {
              ...init,
              redirect: "error",
              signal: AbortSignal.timeout(15_000),
            });
            assert.equal(response.status, expectedStatus, `${path} returned ${response.status}`);
            return response.json();
          };
          const readiness = await request("/api/readiness", {}, 200);
          assert.equal(readiness.releaseId, process.env.EXPECTED_RELEASE_ID);
          assert.equal(readiness.checks?.reportShareSchema, "current");
          assert.equal(readiness.checks?.reportHandoffControl, "enabled");
          assert.equal(readiness.checks?.reportShareAbuseHashing, "configured");
          assert.equal(readiness.capabilities?.reportHandoff, true);
          const redemption = await request("/api/shared/report", {
            method: "POST",
            headers: { "content-type": "application/json", origin: origin.origin },
            body: JSON.stringify({ token: "A".repeat(43) }),
          }, 404);
          assert.equal(redemption.code, "report_share_not_found");
          process.stdout.write(`${JSON.stringify({
            checkedAt: new Date().toISOString(),
            releaseId: readiness.releaseId,
            control: readiness.checks.reportHandoffControl,
            reportHandoff: readiness.capabilities.reportHandoff,
            missingTokenStatus: 404,
            missingTokenCode: redemption.code,
          }, null, 2)}\n`);
          NODE
          trap - EXIT

      - name: Record staging post-canary report handoff counts
        id: handoff_counts
        if: steps.handoff_restore.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT (SELECT COUNT(*) FROM report_shares) AS report_shares,(SELECT COUNT(*) FROM report_share_read_counters) AS report_share_read_counters,(SELECT COUNT(*) FROM report_share_create_counters) AS report_share_create_counters,(SELECT COUNT(*) FROM report_handoff_controls) AS report_handoff_controls,(SELECT COUNT(*) FROM report_handoff_controls WHERE control_key='report_handoff' AND enabled=1) AS enabled_report_handoff_controls;" \
            > "$RUNNER_TEMP/staging-post-canary-report-handoff-counts.json"
          node scripts/release-db-evidence.mjs handoff-counts staging \
            "$RUNNER_TEMP/staging-post-canary-report-handoff-counts.json" \
            release-evidence/staging/post-canary-report-handoff-counts.json

      - name: Fail closed staging report handoff before regression handling
        id: handoff_fail_closed
        if: >-
          always() &&
          steps.migrations.outcome == 'success' &&
          steps.migration_drift_guard.outcome == 'success' &&
          steps.current_main_db.outcome == 'success' &&
          (steps.version.outcome != 'success' ||
           steps.propagation.outcome != 'success' ||
           steps.readiness_latency.outcome != 'success' ||
           steps.canary.outcome != 'success' ||
           steps.residue.outcome != 'success' ||
           steps.handoff_reclosed.outcome != 'success' ||
           steps.handoff_restore.outcome != 'success' ||
           steps.handoff_counts.outcome != 'success')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env staging --json --command \
            "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/staging-report-handoff-failure-disable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-report-handoff-failure-disable.json" \
              release-evidence/staging/regression-report-handoff-disabled.json

      - name: Roll back a confirmed compatible staging regression
        id: rollback_regression
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'success' &&
          (steps.propagation.outcome == 'failure' ||
           steps.readiness_latency.outcome == 'failure' ||
           steps.canary.outcome == 'failure' ||
           steps.residue.outcome == 'failure' ||
           steps.handoff_reclosed.outcome == 'failure' ||
           steps.handoff_restore.outcome == 'failure' ||
           steps.handoff_counts.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler rollback "${{ steps.previous.outputs.previous_version }}" --env staging --yes \
            --message "Automatic rollback of failed release $RELEASE_SHA"

      - name: Verify the exact staging version after regression rollback
        if: always() && steps.rollback_regression.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_PAID_CHECKOUT: "false"
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            > release-evidence/staging/regression-rollback.json
          wrangler d1 execute DB --remote --env staging --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/staging-regression-rollback-report-handoff-control.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control staging \
              "$RUNNER_TEMP/staging-regression-rollback-report-handoff-control.json" \
              release-evidence/staging/regression-rollback-report-handoff-control.json

      - name: Fail closed after a staging release regression
        if: >-
          always() &&
          (steps.propagation.outcome == 'failure' ||
           steps.readiness_latency.outcome == 'failure' ||
           steps.canary.outcome == 'failure' ||
           steps.residue.outcome == 'failure' ||
           steps.handoff_reclosed.outcome == 'failure' ||
           steps.handoff_restore.outcome == 'failure' ||
           steps.handoff_counts.outcome == 'failure' ||
           steps.handoff_fail_closed.outcome == 'failure')
        run: exit 1

      - name: Remove staging backup material from the runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP:?}/grihagrid-staging-pre-migration"
          rm -f -- \
            "$RUNNER_TEMP/staging-pre-migration-counts.json" \
            "$RUNNER_TEMP/staging-pre-migration-audit.json" \
            "$RUNNER_TEMP/staging-pre-migration-users.json" \
            "$RUNNER_TEMP/staging-pre-migration-sessions.json" \
            "$RUNNER_TEMP/staging-pre-migration-projects.json" \
            "$RUNNER_TEMP/staging-pre-migration-reports.json" \
            "$RUNNER_TEMP/staging-post-migration-counts.json" \
            "$RUNNER_TEMP/staging-post-migration-users.json" \
            "$RUNNER_TEMP/staging-post-migration-sessions.json" \
            "$RUNNER_TEMP/staging-post-migration-projects.json" \
            "$RUNNER_TEMP/staging-post-migration-reports.json" \
            "$RUNNER_TEMP/staging-post-migration-feedback-count.json" \
            "$RUNNER_TEMP/staging-post-migration-report-share-count.json" \
            "$RUNNER_TEMP/staging-post-migration-report-share-read-counter-count.json" \
            "$RUNNER_TEMP/staging-post-migration-report-share-create-counter-count.json" \
            "$RUNNER_TEMP/staging-post-migration-login-attempt-fence-count.json" \
            "$RUNNER_TEMP/staging-post-migration-report-handoff-control.json" \
            "$RUNNER_TEMP/staging-report-handoff-pre-activation-close.json" \
            "$RUNNER_TEMP/staging-report-handoff-canary-enable.json" \
            "$RUNNER_TEMP/staging-report-handoff-canary-reclose.json" \
            "$RUNNER_TEMP/staging-report-handoff-reclosed.json" \
            "$RUNNER_TEMP/staging-report-handoff-enable.json" \
            "$RUNNER_TEMP/staging-report-handoff-restore-failure-disable.json" \
            "$RUNNER_TEMP/staging-report-handoff-unverified-disable.json" \
            "$RUNNER_TEMP/staging-unverified-rollback-report-handoff-control.json" \
            "$RUNNER_TEMP/staging-report-handoff-failure-disable.json" \
            "$RUNNER_TEMP/staging-regression-rollback-report-handoff-control.json" \
            "$RUNNER_TEMP/staging-post-canary-report-handoff-counts.json" \
            "$RUNNER_TEMP/staging-rollback-residue.sql" \
            "$RUNNER_TEMP/staging-rollback-residue.json" \
            "$RUNNER_TEMP/staging-canary-residue.sql" \
            "$RUNNER_TEMP/staging-canary-residue.json" \
            "$RUNNER_TEMP/staging-canary-session-query.sql" \
            "$RUNNER_TEMP/staging-canary-session-before.json" \
            "$RUNNER_TEMP/staging-canary-session-observed.json" \
            "$RUNNER_TEMP/staging-canary-session-cleanup.sql" \
            "$RUNNER_TEMP/staging-canary-session-cleanup.json" \
            "$RUNNER_TEMP/staging-canary-session-final.json" \
            "$RUNNER_TEMP/staging-rollback-canary-session-query.sql" \
            "$RUNNER_TEMP/staging-rollback-canary-session-before.json" \
            "$RUNNER_TEMP/staging-rollback-canary-session-observed.json" \
            "$RUNNER_TEMP/staging-rollback-canary-session-cleanup.sql" \
            "$RUNNER_TEMP/staging-rollback-canary-session-cleanup.json" \
            "$RUNNER_TEMP/staging-rollback-canary-session-final.json"

      - name: Upload staging release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-release-evidence-${{ env.RELEASE_SHA }}
          path: release-evidence/staging
          if-no-files-found: warn
          retention-days: 30

  production:
    name: Migrate, deploy, and observe production
    needs: [authorize, validate, staging]
    if: needs.authorize.outputs.deploy == 'true' && needs.validate.result == 'success' && needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://grihagrid.prakhargupta267.workers.dev
    env:
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
      BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
      ORIGIN: https://grihagrid.prakhargupta267.workers.dev
      STAGING_ORIGIN: https://grihagrid-staging.prakhargupta267.workers.dev

    steps:
      - name: Check out the authorized SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Restore the exact validated build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/grihagrid-release-build

      - name: Prepare the fresh privileged runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f "$RUNNER_TEMP/grihagrid-release-build/client/index.html"
          test -f "$RUNNER_TEMP/grihagrid-release-build/server/index.js"
          if find "$RUNNER_TEMP/grihagrid-release-build" -type l -print -quit | grep -q .; then
            echo "validated build artifacts may not contain symbolic links" >&2
            exit 1
          fi
          rm -rf -- "$GITHUB_WORKSPACE/dist"
          mv -- "$RUNNER_TEMP/grihagrid-release-build" "$GITHUB_WORKSPACE/dist"
          test -f dist/client/index.html
          test -f dist/server/index.js
          mkdir -p release-evidence/production
          npm install --global --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org "wrangler@$WRANGLER_VERSION"
          test "$(wrangler --version)" = "$WRANGLER_VERSION"

      - name: Enforce immutable, forward-only migrations
        run: |
          set -euo pipefail
          migration_changes="$(git diff --name-status "$BASE_SHA" "$RELEASE_SHA" -- migrations)"
          if [ -n "$migration_changes" ]; then
            while IFS=$'\t' read -r status first_path second_path; do
              if [ "$status" != "A" ]; then
                echo "existing migrations are immutable; found status $status" >&2
                exit 1
              fi
              filename="${first_path##*/}"
              [[ "$filename" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]
              if (( 10#${BASH_REMATCH[1]} <= 12 )); then
                echo "new migrations must follow the trusted 0012 baseline" >&2
                exit 1
              fi
            done <<< "$migration_changes"
          fi
          policy_migrations=()
          for migration in migrations/*.sql; do
            filename="${migration##*/}"
            sequence="${filename%%_*}"
            [[ "$sequence" =~ ^[0-9]{4}$ ]]
            if (( 10#$sequence > 12 )); then policy_migrations+=("$migration"); fi
          done
          if (( ${#policy_migrations[@]} > 0 )); then
            node scripts/check-migration-policy.mjs "${policy_migrations[@]}"
          fi

      - name: Reconfirm the exact staging version after the production hold
        env:
          EXPECT_PAID_CHECKOUT: "false"
          GRIHAGRID_RELEASE_ORIGIN: ${{ env.STAGING_ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ needs.staging.outputs.version_id }}
        run: node scripts/wait-for-release.mjs "$STAGING_ORIGIN" "$GRIHAGRID_RELEASE_ID" > release-evidence/production/staging-reconfirmation.json

      - name: Reconfirm current main after the production hold
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Record current production Worker
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler deployments status --env="" --json > "$RUNNER_TEMP/production-pre-deploy.json"
          previous_version="$(node --input-type=module - "$RUNNER_TEMP/production-pre-deploy.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const input = process.argv[2];
          const status = JSON.parse(readFileSync(input, "utf8"));
          const active = status.versions?.filter((version) => version.percentage === 100) || [];
          if (active.length !== 1 || !/^[0-9a-f-]{36}$/u.test(active[0].version_id || "")) process.exit(1);
          writeFileSync("release-evidence/production/pre-deploy-status.json", `${JSON.stringify({
            activeVersion: active[0].version_id,
            trafficPercentage: 100,
          }, null, 2)}\n`);
          process.stdout.write(active[0].version_id);
          NODE
          )"
          wrangler versions view "$previous_version" --env="" --json > "$RUNNER_TEMP/production-previous-version.json"
          previous_release_sha="$(node --input-type=module - "$RUNNER_TEMP/production-previous-version.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const matches = String(version.annotations?.["workers/message"] || "").match(/\b[a-f0-9]{40}\b/gu) || [];
          if (matches.length !== 1) process.exit(1);
          process.stdout.write(matches[0]);
          NODE
          )"
          git merge-base --is-ancestor "$previous_release_sha" "$RELEASE_SHA" || {
            echo "release would move production behind its currently deployed source history" >&2
            exit 1
          }
          {
            echo "previous_version=$previous_version"
            echo "previous_release_sha=$previous_release_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Inspect pending production migrations and aggregate data state
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 migrations list DB --remote --env="" \
            | tee release-evidence/production/pre-migration-list.txt
          wrangler d1 execute DB --remote --env="" --json --command \
            "WITH entities(entity) AS (VALUES ('users'),('sessions'),('projects'),('reports'),('orders'),('payment_webhook_events')) SELECT entity,CASE entity WHEN 'users' THEN (SELECT COUNT(*) FROM users) WHEN 'sessions' THEN (SELECT COUNT(*) FROM sessions) WHEN 'projects' THEN (SELECT COUNT(*) FROM projects) WHEN 'reports' THEN (SELECT COUNT(*) FROM reports) WHEN 'orders' THEN (SELECT COUNT(*) FROM orders) WHEN 'payment_webhook_events' THEN (SELECT COUNT(*) FROM payment_webhook_events) END AS row_count FROM entities;" \
            > "$RUNNER_TEMP/production-pre-migration-counts.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT (SELECT COUNT(*) FROM projects WHERE NOT json_valid(input_json) OR json_type(input_json)!='object') AS invalid_input_rows,(SELECT COUNT(DISTINCT p.id) FROM projects p,json_each(p.input_json) field WHERE field.key NOT IN ('width','length','city','facing','floors','bedrooms','bathrooms','parking','style','quality','roadWidthFt','plotShape','accessibility','futureUse','budgetLakh')) AS unknown_input_rows,(SELECT COUNT(*) FROM projects p,json_each(p.input_json) field WHERE field.key='soilReport') AS soil_report_keys,(SELECT COUNT(*) FROM project_revision_reports rr WHERE rr.report_schema_version=2 AND (NOT json_valid(rr.content_json) OR json_type(rr.content_json,'$.risks')!='array' OR NOT EXISTS (SELECT 1 FROM json_each(rr.content_json,'$.risks') risk WHERE risk.type='text' AND risk.value='Foundation assumptions must be validated through a geotechnical investigation.'))) AS unsafe_revision_reports,(SELECT COUNT(*) FROM reports report WHERE report.version=2 AND (NOT json_valid(report.content_json) OR json_type(report.content_json,'$.risks')!='array' OR NOT EXISTS (SELECT 1 FROM json_each(report.content_json,'$.risks') risk WHERE risk.type='text' AND risk.value='Foundation assumptions must be validated through a geotechnical investigation.'))) AS unsafe_current_reports;" \
            > "$RUNNER_TEMP/production-pre-migration-audit.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM users ORDER BY id;" > "$RUNNER_TEMP/production-pre-migration-users.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM sessions ORDER BY id;" > "$RUNNER_TEMP/production-pre-migration-sessions.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM projects ORDER BY id;" > "$RUNNER_TEMP/production-pre-migration-projects.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM reports ORDER BY id;" > "$RUNNER_TEMP/production-pre-migration-reports.json"
          node scripts/release-db-evidence.mjs pre production \
            "$RUNNER_TEMP/production-pre-migration-counts.json" \
            "$RUNNER_TEMP/production-pre-migration-audit.json" \
            "$RUNNER_TEMP/production-pre-migration-users.json" \
            "$RUNNER_TEMP/production-pre-migration-sessions.json" \
            "$RUNNER_TEMP/production-pre-migration-projects.json" \
            "$RUNNER_TEMP/production-pre-migration-reports.json" \
            release-evidence/production/pre-migration-proof.json
          if grep -Fq "No migrations to apply!" release-evidence/production/pre-migration-list.txt; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0013_report_feedback_and_intake_hardening.sql" release-evidence/production/pre-migration-list.txt; then
            echo "feedback_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "feedback_pending=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0016_report_handoff_links.sql" release-evidence/production/pre-migration-list.txt; then
            echo "report_share_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_share_pending=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq "0017_login_attempt_fence.sql" release-evidence/production/pre-migration-list.txt; then
            echo "login_attempt_fence_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "login_attempt_fence_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject unexpected production migration drift
        id: migration_drift_guard
        env:
          AUTHORIZED_MIGRATIONS: ${{ needs.authorize.outputs.migrations }}
          REMOTE_PENDING_MIGRATIONS: ${{ steps.migrations.outputs.pending }}
        run: |
          set -euo pipefail
          if [[ "$AUTHORIZED_MIGRATIONS" == "false" && "$REMOTE_PENDING_MIGRATIONS" == "true" ]]; then
            echo "production has pending migrations outside the authorized release diff" >&2
            exit 1
          fi

      - name: Create protected production export and recovery point
        id: raw_backup
        if: steps.migrations.outputs.pending == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          backup_directory="$RUNNER_TEMP/grihagrid-production-pre-migration"
          mkdir -m 700 "$backup_directory"
          raw_backup="$backup_directory/d1-pre-migration.sql"
          wrangler d1 export DB --remote --env="" --skip-confirmation --output "$raw_backup"
          chmod 600 "$raw_backup"
          raw_sha256="$(sha256sum "$raw_backup" | awk '{ print $1 }')"
          raw_permissions="$(stat -c '%a' "$raw_backup")"
          test "$raw_permissions" = "600"
          wrangler d1 time-travel info DB --env="" --json > "$backup_directory/time-travel.json"
          bookmark="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).bookmark' "$backup_directory/time-travel.json")"
          [[ "$bookmark" =~ ^[A-Za-z0-9._:-]{16,256}$ ]]
          {
            echo "backup_directory=$backup_directory"
            echo "raw_sha256=$raw_sha256"
            echo "raw_permissions=$raw_permissions"
            echo "bookmark=$bookmark"
          } >> "$GITHUB_OUTPUT"

      - name: Encrypt and verify protected production export
        id: backup
        if: steps.migrations.outputs.pending == 'true'
        env:
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
          BACKUP_DIRECTORY: ${{ steps.raw_backup.outputs.backup_directory }}
          RAW_SHA256: ${{ steps.raw_backup.outputs.raw_sha256 }}
          RAW_PERMISSIONS: ${{ steps.raw_backup.outputs.raw_permissions }}
          BOOKMARK: ${{ steps.raw_backup.outputs.bookmark }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          test "${#D1_BACKUP_PASSPHRASE}" -ge 20
          umask 077
          raw_backup="$BACKUP_DIRECTORY/d1-pre-migration.sql"
          encrypted_backup="$BACKUP_DIRECTORY/d1-pre-migration.sql.ggrid"
          verified_backup="$BACKUP_DIRECTORY/d1-verified.sql"
          node scripts/backup-crypto.mjs encrypt "$raw_backup" "$encrypted_backup"
          node scripts/backup-crypto.mjs decrypt "$encrypted_backup" "$verified_backup"
          test "$(sha256sum "$verified_backup" | awk '{ print $1 }')" = "$RAW_SHA256"
          encrypted_sha256="$(sha256sum "$encrypted_backup" | awk '{ print $1 }')"
          rm -f -- "$raw_backup" "$verified_backup" "$BACKUP_DIRECTORY/time-travel.json"
          ENCRYPTED_SHA256="$encrypted_sha256" node --input-type=module - "$BACKUP_DIRECTORY/manifest.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(process.argv[2], `${JSON.stringify({
            format: "GGRIDBK1-AES-256-GCM",
            keyVersion: process.env.BACKUP_KEY_VERSION,
            environment: "production",
            releaseSha: process.env.RELEASE_SHA,
            createdAt: new Date().toISOString(),
            rawSha256: process.env.RAW_SHA256,
            rawPermissions: process.env.RAW_PERMISSIONS,
            encryptedSha256: process.env.ENCRYPTED_SHA256,
            decryptVerification: "passed",
            timeTravelBookmark: process.env.BOOKMARK,
            previousWorkerVersion: process.env.PREVIOUS_VERSION,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE
          cp "$BACKUP_DIRECTORY/manifest.json" release-evidence/production/pre-migration-backup-manifest.json
          echo "backup_directory=$BACKUP_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Store encrypted production export
        if: steps.migrations.outputs.pending == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-d1-pre-migration-${{ env.RELEASE_SHA }}
          path: ${{ steps.backup.outputs.backup_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Reconfirm current main before production database mutation
        id: current_main_db
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Apply and verify production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIGRATIONS_PENDING: ${{ steps.migrations.outputs.pending }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${{ steps.migrations.outputs.pending }}" = "true" ]; then
            wrangler d1 migrations apply DB --remote --env=""
          fi
          if [ "${{ steps.migrations.outputs.report_share_pending }}" != "true" ]; then
            wrangler d1 execute DB --remote --env="" --json --command \
              "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
              > "$RUNNER_TEMP/production-report-handoff-pre-activation-close.json"
            REPORT_HANDOFF_EXPECTED_ENABLED=false \
              node scripts/release-db-evidence.mjs handoff-control production \
                "$RUNNER_TEMP/production-report-handoff-pre-activation-close.json" \
                release-evidence/production/pre-activation-report-handoff-closed.json
          fi
          wrangler d1 migrations list DB --remote --env="" \
            | tee release-evidence/production/post-migration-list.txt
          grep -Fq "No migrations to apply!" release-evidence/production/post-migration-list.txt
          wrangler d1 execute DB --remote --env="" --json --command "PRAGMA foreign_key_check;" \
            > release-evidence/production/foreign-key-check.json
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT type,name FROM sqlite_schema WHERE type IN ('table','index','trigger') AND name NOT LIKE 'sqlite_%' ORDER BY type,name;" \
            > release-evidence/production/schema-objects.json
          wrangler d1 execute DB --remote --env="" --json --command \
            "WITH target_tables(table_name) AS (VALUES ('users'),('sessions'),('password_change_attempt_counters'),('login_attempt_fences'),('report_share_read_counters'),('report_share_create_counters'),('report_handoff_controls'),('projects'),('orders'),('project_revisions'),('report_feedback'),('report_shares')) SELECT target_tables.table_name,columns.name FROM target_tables JOIN pragma_table_info(target_tables.table_name) AS columns ORDER BY target_tables.table_name,columns.name;" \
            > "$RUNNER_TEMP/production-schema-columns.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "WITH entities(entity) AS (VALUES ('users'),('sessions'),('projects'),('reports'),('orders'),('payment_webhook_events')) SELECT entity,CASE entity WHEN 'users' THEN (SELECT COUNT(*) FROM users) WHEN 'sessions' THEN (SELECT COUNT(*) FROM sessions) WHEN 'projects' THEN (SELECT COUNT(*) FROM projects) WHEN 'reports' THEN (SELECT COUNT(*) FROM reports) WHEN 'orders' THEN (SELECT COUNT(*) FROM orders) WHEN 'payment_webhook_events' THEN (SELECT COUNT(*) FROM payment_webhook_events) END AS row_count FROM entities;" \
            > "$RUNNER_TEMP/production-post-migration-counts.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM users ORDER BY id;" > "$RUNNER_TEMP/production-post-migration-users.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM sessions ORDER BY id;" > "$RUNNER_TEMP/production-post-migration-sessions.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM projects ORDER BY id;" > "$RUNNER_TEMP/production-post-migration-projects.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT * FROM reports ORDER BY id;" > "$RUNNER_TEMP/production-post-migration-reports.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT COUNT(*) AS row_count FROM report_feedback;" > "$RUNNER_TEMP/production-post-migration-feedback-count.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT COUNT(*) AS row_count FROM report_shares;" > "$RUNNER_TEMP/production-post-migration-report-share-count.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT COUNT(*) AS row_count FROM report_share_read_counters;" > "$RUNNER_TEMP/production-post-migration-report-share-read-counter-count.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT COUNT(*) AS row_count FROM report_share_create_counters;" > "$RUNNER_TEMP/production-post-migration-report-share-create-counter-count.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT COUNT(*) AS row_count FROM login_attempt_fences;" > "$RUNNER_TEMP/production-post-migration-login-attempt-fence-count.json"
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" > "$RUNNER_TEMP/production-post-migration-report-handoff-control.json"
          FEEDBACK_MIGRATION_PENDING="${{ steps.migrations.outputs.feedback_pending }}" \
            REPORT_SHARE_MIGRATION_PENDING="${{ steps.migrations.outputs.report_share_pending }}" \
            LOGIN_ATTEMPT_FENCE_MIGRATION_PENDING="${{ steps.migrations.outputs.login_attempt_fence_pending }}" \
            node scripts/release-db-evidence.mjs post production \
              release-evidence/production/pre-migration-proof.json \
              release-evidence/production/foreign-key-check.json \
              release-evidence/production/schema-objects.json \
              "$RUNNER_TEMP/production-schema-columns.json" \
              "$RUNNER_TEMP/production-post-migration-counts.json" \
              "$RUNNER_TEMP/production-post-migration-users.json" \
              "$RUNNER_TEMP/production-post-migration-sessions.json" \
              "$RUNNER_TEMP/production-post-migration-projects.json" \
              "$RUNNER_TEMP/production-post-migration-reports.json" \
              "$RUNNER_TEMP/production-post-migration-feedback-count.json" \
              "$RUNNER_TEMP/production-post-migration-report-share-count.json" \
              "$RUNNER_TEMP/production-post-migration-report-share-read-counter-count.json" \
              "$RUNNER_TEMP/production-post-migration-report-share-create-counter-count.json" \
              "$RUNNER_TEMP/production-post-migration-login-attempt-fence-count.json" \
              "$RUNNER_TEMP/production-post-migration-report-handoff-control.json" \
              release-evidence/production/post-migration-proof.json

      - name: Rehearse rollback Worker against migrated production schema
        id: rollback_compat
        if: needs.authorize.outputs.migrations == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_CANARY_EMAIL: ${{ secrets.GRIHAGRID_CANARY_EMAIL }}
          GRIHAGRID_CANARY_PASSWORD: ${{ secrets.GRIHAGRID_CANARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GRIHAGRID_CANARY_EMAIL"
          test -n "$GRIHAGRID_CANARY_PASSWORD"
          sha256sum scripts/authenticated-smoke.mjs \
            > release-evidence/production/rollback-smoke-source.sha256
          bash scripts/run-canary-session-fence.sh snapshot production rollback
          restore_rollback_canary_sessions() {
            status=$?
            trap - EXIT
            set +e
            attempt_outcome=completed
            if [ "$status" -ne 0 ]; then attempt_outcome=ambiguous; fi
            session_cleanup_status=0
            bash scripts/run-canary-session-fence.sh restore production rollback \
              release-evidence/production/rollback-canary-session-cleanup.json "$attempt_outcome" \
              || session_cleanup_status=1
            if [ "$session_cleanup_status" -ne 0 ]; then
              echo "failed to restore the exact production rollback-canary session baseline" >&2
            fi
            if [ "$status" -eq 0 ] && [ "$session_cleanup_status" -ne 0 ]; then status=1; fi
            exit "$status"
          }
          trap restore_rollback_canary_sessions EXIT
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            node scripts/authenticated-smoke.mjs "$ORIGIN" \
            | tee release-evidence/production/rollback-compatibility-smoke.json

      - name: Prove production rollback rehearsal left zero database residue
        id: rollback_residue
        if: always() && steps.rollback_compat.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-db-evidence.mjs residue-sql production \
            release-evidence/production/rollback-compatibility-smoke.json \
            "$RUNNER_TEMP/production-rollback-residue.sql"
          residue_sql="$(< "$RUNNER_TEMP/production-rollback-residue.sql")"
          wrangler d1 execute DB --remote --env="" --json \
            --command "$residue_sql" \
            > "$RUNNER_TEMP/production-rollback-residue.json"
          node scripts/release-db-evidence.mjs residue production \
            release-evidence/production/rollback-compatibility-smoke.json \
            "$RUNNER_TEMP/production-rollback-residue.json" \
            release-evidence/production/rollback-residue-proof.json

      - name: Reconfirm current main before production Worker activation
        id: current_main_activation
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          node scripts/release-scope.mjs assert-current "$RELEASE_SHA" "$current_main_sha" >/dev/null

      - name: Deploy authorized SHA to production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy --env="" --strict \
            --tag "main-${RELEASE_SHA:0:12}" \
            --message "GrihaGrid release $RELEASE_SHA; controls closed" \
            > "$RUNNER_TEMP/production-deploy.log" 2>&1
          command_status=$?
          set -e
          echo "command_status=$command_status" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact production Worker version
        id: version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND_STATUS: ${{ steps.deploy.outputs.command_status }}
        run: |
          set -euo pipefail
          wrangler deployments status --env="" --json > "$RUNNER_TEMP/production-post-deploy.json"
          version_id="$(node --input-type=module - "$RUNNER_TEMP/production-post-deploy.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const status = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const active = status.versions?.filter((version) => version.percentage === 100) || [];
          if (active.length !== 1) process.exit(1);
          process.stdout.write(String(active[0].version_id || ""));
          NODE
          )"
          [[ "$version_id" =~ ^[0-9a-f-]{36}$ ]]
          test "$version_id" != "${{ steps.previous.outputs.previous_version }}"
          wrangler versions view "$version_id" --env="" --json > "$RUNNER_TEMP/production-version.json"
          EXPECTED_MESSAGE="GrihaGrid release $RELEASE_SHA; controls closed" EXPECTED_TAG="main-${RELEASE_SHA:0:12}" \
            VERSION_ID="$version_id" DEPLOY_COMMAND_STATUS="$DEPLOY_COMMAND_STATUS" \
            node --input-type=module - "$RUNNER_TEMP/production-version.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (version.id !== process.env.VERSION_ID
            || version.annotations?.["workers/message"] !== process.env.EXPECTED_MESSAGE
            || version.annotations?.["workers/tag"] !== process.env.EXPECTED_TAG) process.exit(1);
          writeFileSync("release-evidence/production/post-deploy-status.json", `${JSON.stringify({
            activeVersion: version.id,
            trafficPercentage: 100,
            releaseSha: process.env.RELEASE_SHA,
            tag: process.env.EXPECTED_TAG,
            deployCommandExit: Number(process.env.DEPLOY_COMMAND_STATUS),
          }, null, 2)}\n`);
          NODE
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Disable production report handoff before unverified rollback
        id: handoff_unverified_fail_closed
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env="" --json --command \
            "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/production-report-handoff-unverified-disable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-report-handoff-unverified-disable.json" \
              release-evidence/production/unverified-rollback-report-handoff-disabled.json

      - name: Roll back an unverified compatible production activation
        id: rollback_unverified
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler rollback "${{ steps.previous.outputs.previous_version }}" --env="" --yes \
            --message "Fail-closed rollback of unverified release $RELEASE_SHA"

      - name: Verify the exact production version after unverified rollback
        if: always() && steps.rollback_unverified.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_PAID_CHECKOUT: "false"
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            > release-evidence/production/unverified-deploy-rollback.json
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/production-unverified-rollback-report-handoff-control.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-unverified-rollback-report-handoff-control.json" \
              release-evidence/production/unverified-rollback-report-handoff-control.json

      - name: Wait for sustained exact production smoke samples
        id: propagation
        continue-on-error: true
        env:
          EXPECT_PAID_CHECKOUT: "false"
          EXPECT_REPORT_HANDOFF: "false"
          GRIHAGRID_RELEASE_ORIGIN: ${{ env.ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" | tee release-evidence/production/public-smoke.json

      - name: Gate production readiness latency on the exact version
        id: readiness_latency
        if: steps.propagation.outcome == 'success'
        continue-on-error: true
        env:
          GRIHAGRID_READINESS_ORIGIN: ${{ env.ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ steps.version.outputs.version_id }}
          GRIHAGRID_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECT_AI_PLANNING_BRIEF: "true"
          EXPECT_REPORT_HANDOFF: "false"
        run: |
          set -euo pipefail
          node scripts/readiness-latency.mjs "$GRIHAGRID_READINESS_ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            | tee release-evidence/production/readiness-latency.json

      - name: Run production authenticated canary under bounded handoff activation
        id: canary
        if: steps.propagation.outcome == 'success' && steps.readiness_latency.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_RELEASE_ID: ${{ steps.version.outputs.version_id }}
          GRIHAGRID_CANARY_EMAIL: ${{ secrets.GRIHAGRID_CANARY_EMAIL }}
          GRIHAGRID_CANARY_PASSWORD: ${{ secrets.GRIHAGRID_CANARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GRIHAGRID_CANARY_EMAIL"
          test -n "$GRIHAGRID_CANARY_PASSWORD"
          bash scripts/run-canary-session-fence.sh snapshot production candidate
          reclose_report_handoff_after_canary() {
            status=$?
            trap - EXIT
            set +e
            env -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
              wrangler d1 execute DB --remote --env="" --json --command \
              "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
              > "$RUNNER_TEMP/production-report-handoff-canary-reclose.json"
            reclose_status=$?
            if [ "$reclose_status" -eq 0 ]; then
              env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
                -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
                REPORT_HANDOFF_EXPECTED_ENABLED=false \
                node scripts/release-db-evidence.mjs handoff-control production \
                  "$RUNNER_TEMP/production-report-handoff-canary-reclose.json" \
                  release-evidence/production/report-handoff-canary-reclosed.json
              proof_status=$?
            else
              proof_status=1
              echo "failed to re-close production report handoff after the authenticated canary" >&2
            fi
            session_cleanup_status=0
            attempt_outcome=completed
            if [ "$status" -ne 0 ]; then attempt_outcome=ambiguous; fi
            bash scripts/run-canary-session-fence.sh restore production candidate \
              release-evidence/production/canary-session-cleanup.json "$attempt_outcome" \
              || session_cleanup_status=1
            if [ "$session_cleanup_status" -ne 0 ]; then
              echo "failed to restore the exact production canary session baseline" >&2
            fi
            if [ "$status" -eq 0 ] && { [ "$reclose_status" -ne 0 ] || [ "$proof_status" -ne 0 ] || [ "$session_cleanup_status" -ne 0 ]; }; then
              status=1
            fi
            exit "$status"
          }
          trap reclose_report_handoff_after_canary EXIT
          env -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
            wrangler d1 execute DB --remote --env="" --json --command \
            "UPDATE report_handoff_controls SET enabled=1,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/production-report-handoff-canary-enable.json"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            -u GRIHAGRID_CANARY_EMAIL -u GRIHAGRID_CANARY_PASSWORD \
            REPORT_HANDOFF_EXPECTED_ENABLED=true \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-report-handoff-canary-enable.json" \
              release-evidence/production/report-handoff-canary-enabled.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            node scripts/authenticated-smoke.mjs "$ORIGIN" \
            | tee release-evidence/production/authenticated-smoke.json

      - name: Prove production canary left zero database residue
        id: residue
        if: always() && steps.canary.outcome != 'skipped'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-db-evidence.mjs residue-sql production \
            release-evidence/production/authenticated-smoke.json \
            "$RUNNER_TEMP/production-canary-residue.sql"
          residue_sql="$(< "$RUNNER_TEMP/production-canary-residue.sql")"
          wrangler d1 execute DB --remote --env="" --json \
            --command "$residue_sql" \
            > "$RUNNER_TEMP/production-canary-residue.json"
          node scripts/release-db-evidence.mjs residue production \
            release-evidence/production/authenticated-smoke.json \
            "$RUNNER_TEMP/production-canary-residue.json" \
            release-evidence/production/post-canary-residue-proof.json

      - name: Prove production report handoff reclosed after authenticated canary
        id: handoff_reclosed
        if: always() && steps.canary.outcome != 'skipped'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/production-report-handoff-reclosed.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-report-handoff-reclosed.json" \
              release-evidence/production/report-handoff-reclosed-control.json
          node --input-type=module > release-evidence/production/report-handoff-disabled-http.json <<'NODE'
          import assert from "node:assert/strict";
          const origin = new URL(process.env.ORIGIN);
          const request = async (path, init, expectedStatus) => {
            const response = await fetch(new URL(path, origin), {
              ...init,
              redirect: "error",
              signal: AbortSignal.timeout(15_000),
            });
            assert.equal(response.status, expectedStatus, `${path} returned ${response.status}`);
            return response.json();
          };
          const readiness = await request("/api/readiness", {}, 200);
          assert.equal(readiness.releaseId, process.env.EXPECTED_RELEASE_ID);
          assert.equal(readiness.checks?.reportShareSchema, "current");
          assert.equal(readiness.checks?.reportHandoffControl, "disabled");
          assert.equal(readiness.checks?.reportShareAbuseHashing, "configured");
          assert.equal(readiness.capabilities?.reportHandoff, false);
          const redemption = await request("/api/shared/report", {
            method: "POST",
            headers: { "content-type": "application/json", origin: origin.origin },
            body: JSON.stringify({ token: "A".repeat(43) }),
          }, 503);
          assert.equal(redemption.code, "report_handoff_disabled");
          process.stdout.write(`${JSON.stringify({
            checkedAt: new Date().toISOString(),
            releaseId: readiness.releaseId,
            control: readiness.checks.reportHandoffControl,
            reportHandoff: readiness.capabilities.reportHandoff,
            redemptionStatus: 503,
            redemptionCode: redemption.code,
          }, null, 2)}\n`);
          NODE

      - name: Restore and verify production report handoff control
        id: handoff_restore
        if: >-
          always() &&
          steps.canary.outcome == 'success' &&
          steps.residue.outcome == 'success' &&
          steps.handoff_reclosed.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_RELEASE_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          umask 077
          reclose_report_handoff_on_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              set +e
              wrangler d1 execute DB --remote --env="" --json --command \
                "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
                > "$RUNNER_TEMP/production-report-handoff-restore-failure-disable.json"
              reclose_status=$?
              if [ "$reclose_status" -eq 0 ]; then
                REPORT_HANDOFF_EXPECTED_ENABLED=false \
                  node scripts/release-db-evidence.mjs handoff-control production \
                    "$RUNNER_TEMP/production-report-handoff-restore-failure-disable.json" \
                    release-evidence/production/report-handoff-restore-failure-control.json
              else
                echo "failed to re-close production report handoff after restoration proof failure" >&2
              fi
            fi
            exit "$status"
          }
          trap reclose_report_handoff_on_failure EXIT
          wrangler d1 execute DB --remote --env="" --json --command \
            "UPDATE report_handoff_controls SET enabled=1,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/production-report-handoff-enable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=true \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-report-handoff-enable.json" \
              release-evidence/production/report-handoff-enabled-control.json
          node --input-type=module > release-evidence/production/report-handoff-enabled-http.json <<'NODE'
          import assert from "node:assert/strict";
          const origin = new URL(process.env.ORIGIN);
          const request = async (path, init, expectedStatus) => {
            const response = await fetch(new URL(path, origin), {
              ...init,
              redirect: "error",
              signal: AbortSignal.timeout(15_000),
            });
            assert.equal(response.status, expectedStatus, `${path} returned ${response.status}`);
            return response.json();
          };
          const readiness = await request("/api/readiness", {}, 200);
          assert.equal(readiness.releaseId, process.env.EXPECTED_RELEASE_ID);
          assert.equal(readiness.checks?.reportShareSchema, "current");
          assert.equal(readiness.checks?.reportHandoffControl, "enabled");
          assert.equal(readiness.checks?.reportShareAbuseHashing, "configured");
          assert.equal(readiness.capabilities?.reportHandoff, true);
          const redemption = await request("/api/shared/report", {
            method: "POST",
            headers: { "content-type": "application/json", origin: origin.origin },
            body: JSON.stringify({ token: "A".repeat(43) }),
          }, 404);
          assert.equal(redemption.code, "report_share_not_found");
          process.stdout.write(`${JSON.stringify({
            checkedAt: new Date().toISOString(),
            releaseId: readiness.releaseId,
            control: readiness.checks.reportHandoffControl,
            reportHandoff: readiness.capabilities.reportHandoff,
            missingTokenStatus: 404,
            missingTokenCode: redemption.code,
          }, null, 2)}\n`);
          NODE
          trap - EXIT

      - name: Record production post-canary report handoff counts
        id: handoff_counts
        if: steps.handoff_restore.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT (SELECT COUNT(*) FROM report_shares) AS report_shares,(SELECT COUNT(*) FROM report_share_read_counters) AS report_share_read_counters,(SELECT COUNT(*) FROM report_share_create_counters) AS report_share_create_counters,(SELECT COUNT(*) FROM report_handoff_controls) AS report_handoff_controls,(SELECT COUNT(*) FROM report_handoff_controls WHERE control_key='report_handoff' AND enabled=1) AS enabled_report_handoff_controls;" \
            > "$RUNNER_TEMP/production-post-canary-report-handoff-counts.json"
          node scripts/release-db-evidence.mjs handoff-counts production \
            "$RUNNER_TEMP/production-post-canary-report-handoff-counts.json" \
            release-evidence/production/post-canary-report-handoff-counts.json

      - name: Observe the exact production version for 30 minutes
        id: observe
        if: steps.handoff_counts.outcome == 'success'
        continue-on-error: true
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRIHAGRID_MONITOR_ORIGIN: ${{ env.ORIGIN }}
          GRIHAGRID_RELEASE_ID: ${{ steps.version.outputs.version_id }}
          GRIHAGRID_MONITOR_DURATION_MS: "1800000"
          GRIHAGRID_MONITOR_INTERVAL_MS: "90000"
        run: |
          set -euo pipefail
          invocation_summary="release-evidence/production/invocation-tail-aggregate.json"
          server_summary="release-evidence/production/server-tail-aggregate.json"
          invocation_stderr="$RUNNER_TEMP/invocation-tail.stderr"
          server_stderr="$RUNNER_TEMP/server-tail.stderr"

          command -v setsid >/dev/null
          INVOCATION_SUMMARY="$invocation_summary" setsid bash -c '
            set -o pipefail
            CLOUDFLARE_API_TOKEN="$CF_DEPLOY_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_DEPLOY_ACCOUNT" \
              WRANGLER_LOG=warn WRANGLER_HIDE_BANNER=true WRANGLER_WRITE_LOGS=false \
              timeout --signal=INT --kill-after=10s 2100s \
              wrangler tail --env="" --format json --status error \
                --version-id "$GRIHAGRID_RELEASE_ID" \
              | env -u CF_DEPLOY_TOKEN -u CF_DEPLOY_ACCOUNT -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
                TAIL_STOP_ON_EVENT=true TAIL_PROCESS_GROUP="$$" \
                node scripts/tail-aggregate.mjs "$INVOCATION_SUMMARY"
          ' 2> "$invocation_stderr" &
          invocation_pid=$!
          SERVER_SUMMARY="$server_summary" setsid bash -c '
            set -o pipefail
            CLOUDFLARE_API_TOKEN="$CF_DEPLOY_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_DEPLOY_ACCOUNT" \
              WRANGLER_LOG=warn WRANGLER_HIDE_BANNER=true WRANGLER_WRITE_LOGS=false \
              timeout --signal=INT --kill-after=10s 2100s \
              wrangler tail --env="" --format json \
                --search "\"outcome\":\"server_error\"" --version-id "$GRIHAGRID_RELEASE_ID" \
              | env -u CF_DEPLOY_TOKEN -u CF_DEPLOY_ACCOUNT -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
                TAIL_STOP_ON_EVENT=true TAIL_PROCESS_GROUP="$$" \
                node scripts/tail-aggregate.mjs "$SERVER_SUMMARY"
          ' 2> "$server_stderr" &
          server_pid=$!
          unset CF_DEPLOY_TOKEN CF_DEPLOY_ACCOUNT
          sleep 5

          tails_alive=true
          kill -0 "$invocation_pid" 2>/dev/null || tails_alive=false
          kill -0 "$server_pid" 2>/dev/null || tails_alive=false

          set +e
          GRIHAGRID_MONITOR_WATCH_PIDS="$invocation_pid,$server_pid" \
            node scripts/monitor-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            | tee release-evidence/production/monitor.json
          monitor_status=${PIPESTATUS[0]}
          kill -0 "$invocation_pid" 2>/dev/null || tails_alive=false
          kill -0 "$server_pid" 2>/dev/null || tails_alive=false
          public_regression=false
          monitor_infrastructure_failure=false
          case "$monitor_status" in
            0) ;;
            1) public_regression=true ;;
            2) monitor_infrastructure_failure=true ;;
            *) monitor_infrastructure_failure=true ;;
          esac
          {
            echo "public_regression=$public_regression"
            echo "monitor_infrastructure_failure=$monitor_infrastructure_failure"
          } >> "$GITHUB_OUTPUT"
          kill -TERM -- "-$invocation_pid" 2>/dev/null || true
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          wait "$invocation_pid"
          invocation_status=$?
          wait "$server_pid"
          server_status=$?
          invocation_stderr_bytes="$(wc -c < "$invocation_stderr")"
          server_stderr_bytes="$(wc -c < "$server_stderr")"
          set -e

          for attempt in $(seq 1 50); do
            if [ -s "$invocation_summary" ] && [ -s "$server_summary" ]; then
              break
            fi
            sleep 0.1
          done

          tail_regression="$(node --input-type=module - "$invocation_summary" "$server_summary" <<'NODE'
          import { readFileSync } from "node:fs";
          let regression = false;
          for (const file of process.argv.slice(2)) {
            try {
              const aggregate = JSON.parse(readFileSync(file, "utf8"));
              if (Number(aggregate.eventCount) > 0) regression = true;
            } catch {
              // Combined validation below treats missing or malformed evidence as infrastructure failure.
            }
          }
          process.stdout.write(String(regression));
          NODE
          )"
          echo "tail_regression=$tail_regression" >> "$GITHUB_OUTPUT"

          rm -f -- "$invocation_stderr" "$server_stderr"

          MONITOR_STATUS="$monitor_status" PUBLIC_REGRESSION="$public_regression" \
            TAIL_REGRESSION="$tail_regression" MONITOR_INFRASTRUCTURE_FAILURE="$monitor_infrastructure_failure" TAILS_ALIVE="$tails_alive" \
            INVOCATION_STATUS="$invocation_status" SERVER_STATUS="$server_status" \
            INVOCATION_STDERR_BYTES="$invocation_stderr_bytes" SERVER_STDERR_BYTES="$server_stderr_bytes" \
            node --input-type=module - "$invocation_summary" "$server_summary" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          const [invocationFile, serverFile, output] = process.argv.slice(2);
          const invocation = JSON.parse(readFileSync(invocationFile, "utf8"));
          const server = JSON.parse(readFileSync(serverFile, "utf8"));
          const monitorStatus = Number(process.env.MONITOR_STATUS);
          const invocationStatus = Number(process.env.INVOCATION_STATUS);
          const serverStatus = Number(process.env.SERVER_STATUS);
          const publicRegression = process.env.PUBLIC_REGRESSION === "true";
          const tailRegression = process.env.TAIL_REGRESSION === "true";
          const stoppedEarly = monitorStatus !== 0;
          const tailsStoppedByOperator = invocationStatus === 143 && serverStatus === 143;
          const regression = publicRegression || tailRegression || invocation.eventCount > 0 || server.eventCount > 0;
          const infrastructureFailure = process.env.MONITOR_INFRASTRUCTURE_FAILURE === "true"
            || process.env.TAILS_ALIVE !== "true"
            || Number(process.env.INVOCATION_STDERR_BYTES) !== 0
            || Number(process.env.SERVER_STDERR_BYTES) !== 0
            || !tailsStoppedByOperator;
          writeFileSync("release-evidence/production/tail-health.json", `${JSON.stringify({
            exactVersion: process.env.GRIHAGRID_RELEASE_ID,
            configuredDurationMs: 1_800_000,
            completedFullDuration: !stoppedEarly,
            publicRegression,
            tailRegression,
            invocationEvents: invocation.eventCount,
            invocationBytes: invocation.byteCount,
            handledServerErrorEvents: server.eventCount,
            handledServerErrorBytes: server.byteCount,
            tailsAliveThroughPublicMonitor: process.env.TAILS_ALIVE === "true",
            invocationProcessExit: invocationStatus,
            serverProcessExit: serverStatus,
            tailsStoppedByOperator,
            invocationStderrBytes: Number(process.env.INVOCATION_STDERR_BYTES),
            serverStderrBytes: Number(process.env.SERVER_STDERR_BYTES),
            regression,
            infrastructureFailure,
          }, null, 2)}\n`);
          appendFileSync(output, `regression=${regression}\ninfrastructure_failure=${infrastructureFailure}\n`);
          if (regression || infrastructureFailure) process.exit(1);
          NODE

      - name: Fail closed production report handoff before regression handling
        id: handoff_fail_closed
        if: >-
          always() &&
          steps.migrations.outcome == 'success' &&
          steps.migration_drift_guard.outcome == 'success' &&
          steps.current_main_db.outcome == 'success' &&
          (steps.version.outcome != 'success' ||
           steps.propagation.outcome != 'success' ||
           steps.readiness_latency.outcome != 'success' ||
           steps.canary.outcome != 'success' ||
           steps.residue.outcome != 'success' ||
           steps.handoff_reclosed.outcome != 'success' ||
           steps.handoff_restore.outcome != 'success' ||
           steps.handoff_counts.outcome != 'success' ||
           steps.observe.outcome != 'success')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          wrangler d1 execute DB --remote --env="" --json --command \
            "UPDATE report_handoff_controls SET enabled=0,updated_at=datetime('now') WHERE control_key='report_handoff' RETURNING control_key,enabled;" \
            > "$RUNNER_TEMP/production-report-handoff-failure-disable.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-report-handoff-failure-disable.json" \
              release-evidence/production/regression-report-handoff-disabled.json

      - name: Roll back a confirmed compatible production regression
        id: rollback_regression
        if: >-
          always() &&
          (needs.authorize.outputs.migrations == 'false' ||
           (steps.rollback_compat.outcome == 'success' && steps.rollback_residue.outcome == 'success')) &&
          steps.version.outcome == 'success' &&
          (steps.propagation.outcome == 'failure' ||
           steps.readiness_latency.outcome == 'failure' ||
           steps.canary.outcome == 'failure' ||
           steps.residue.outcome == 'failure' ||
           steps.handoff_reclosed.outcome == 'failure' ||
           steps.handoff_restore.outcome == 'failure' ||
           steps.handoff_counts.outcome == 'failure' ||
           steps.observe.outputs.public_regression == 'true' ||
           steps.observe.outputs.tail_regression == 'true' ||
           steps.observe.outputs.regression == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler rollback "${{ steps.previous.outputs.previous_version }}" --env="" --yes \
            --message "Automatic rollback of failed release $RELEASE_SHA"

      - name: Verify the exact production version after regression rollback
        if: always() && steps.rollback_regression.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_PAID_CHECKOUT: "false"
          LEGACY_WORKER_COMPAT: "true"
          GRIHAGRID_RELEASE_ID: ${{ steps.previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/wait-for-release.mjs "$ORIGIN" "$GRIHAGRID_RELEASE_ID" \
            > release-evidence/production/regression-rollback.json
          wrangler d1 execute DB --remote --env="" --json --command \
            "SELECT control_key,enabled FROM report_handoff_controls ORDER BY control_key;" \
            > "$RUNNER_TEMP/production-regression-rollback-report-handoff-control.json"
          REPORT_HANDOFF_EXPECTED_ENABLED=false \
            node scripts/release-db-evidence.mjs handoff-control production \
              "$RUNNER_TEMP/production-regression-rollback-report-handoff-control.json" \
              release-evidence/production/regression-rollback-report-handoff-control.json

      - name: Fail closed after a production release or monitoring failure
        if: >-
          always() &&
          (steps.propagation.outcome == 'failure' ||
           steps.readiness_latency.outcome == 'failure' ||
           steps.canary.outcome == 'failure' ||
           steps.residue.outcome == 'failure' ||
           steps.handoff_reclosed.outcome == 'failure' ||
           steps.handoff_restore.outcome == 'failure' ||
           steps.handoff_counts.outcome == 'failure' ||
           steps.observe.outcome == 'failure' ||
           steps.handoff_fail_closed.outcome == 'failure')
        run: exit 1

      - name: Remove production backup material from the runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP:?}/grihagrid-production-pre-migration"
          rm -f -- \
            "$RUNNER_TEMP/production-pre-migration-counts.json" \
            "$RUNNER_TEMP/production-pre-migration-audit.json" \
            "$RUNNER_TEMP/production-pre-migration-users.json" \
            "$RUNNER_TEMP/production-pre-migration-sessions.json" \
            "$RUNNER_TEMP/production-pre-migration-projects.json" \
            "$RUNNER_TEMP/production-pre-migration-reports.json" \
            "$RUNNER_TEMP/production-post-migration-counts.json" \
            "$RUNNER_TEMP/production-post-migration-users.json" \
            "$RUNNER_TEMP/production-post-migration-sessions.json" \
            "$RUNNER_TEMP/production-post-migration-projects.json" \
            "$RUNNER_TEMP/production-post-migration-reports.json" \
            "$RUNNER_TEMP/production-post-migration-feedback-count.json" \
            "$RUNNER_TEMP/production-post-migration-report-share-count.json" \
            "$RUNNER_TEMP/production-post-migration-report-share-read-counter-count.json" \
            "$RUNNER_TEMP/production-post-migration-report-share-create-counter-count.json" \
            "$RUNNER_TEMP/production-post-migration-login-attempt-fence-count.json" \
            "$RUNNER_TEMP/production-post-migration-report-handoff-control.json" \
            "$RUNNER_TEMP/production-report-handoff-pre-activation-close.json" \
            "$RUNNER_TEMP/production-report-handoff-canary-enable.json" \
            "$RUNNER_TEMP/production-report-handoff-canary-reclose.json" \
            "$RUNNER_TEMP/production-report-handoff-reclosed.json" \
            "$RUNNER_TEMP/production-report-handoff-enable.json" \
            "$RUNNER_TEMP/production-report-handoff-restore-failure-disable.json" \
            "$RUNNER_TEMP/production-report-handoff-unverified-disable.json" \
            "$RUNNER_TEMP/production-unverified-rollback-report-handoff-control.json" \
            "$RUNNER_TEMP/production-report-handoff-failure-disable.json" \
            "$RUNNER_TEMP/production-regression-rollback-report-handoff-control.json" \
            "$RUNNER_TEMP/production-post-canary-report-handoff-counts.json" \
            "$RUNNER_TEMP/production-rollback-residue.sql" \
            "$RUNNER_TEMP/production-rollback-residue.json" \
            "$RUNNER_TEMP/production-canary-residue.sql" \
            "$RUNNER_TEMP/production-canary-residue.json" \
            "$RUNNER_TEMP/production-canary-session-query.sql" \
            "$RUNNER_TEMP/production-canary-session-before.json" \
            "$RUNNER_TEMP/production-canary-session-observed.json" \
            "$RUNNER_TEMP/production-canary-session-cleanup.sql" \
            "$RUNNER_TEMP/production-canary-session-cleanup.json" \
            "$RUNNER_TEMP/production-canary-session-final.json" \
            "$RUNNER_TEMP/production-rollback-canary-session-query.sql" \
            "$RUNNER_TEMP/production-rollback-canary-session-before.json" \
            "$RUNNER_TEMP/production-rollback-canary-session-observed.json" \
            "$RUNNER_TEMP/production-rollback-canary-session-cleanup.sql" \
            "$RUNNER_TEMP/production-rollback-canary-session-cleanup.json" \
            "$RUNNER_TEMP/production-rollback-canary-session-final.json"

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-evidence-${{ env.RELEASE_SHA }}
          path: release-evidence/production
          if-no-files-found: warn
          retention-days: 30
